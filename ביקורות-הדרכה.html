<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת ביקורות הדרכה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* ===== בה"ד הדרכה — design tokens ===== */
  --paper:#f2f4f8; --paper-2:#e7ebf2; --white:#ffffff;
  --line:#d3dae5; --line2:#b7c1d2;
  --ink:#1d2740; --ink-900:#161e30; --ink2:#2b3856; --muted:#5a6786; --faint:#8592ad;
  --blue-700:#1a4c8c; --blue-600:#235fa8; --blue-500:#2e79c9; --blue-100:#dbe7f6; --blue-50:#eef4fb;
  --teal-700:#4d6b5e; --teal-600:#789b8b; --teal-100:#e2ebe7;
  --pos-600:#4d8a19; --pos-100:#e6f0d6; --mid-600:#3f6199; --mid-100:#dee5f1;
  --neg-600:#a33241; --neg-100:#f3dde0;
  /* aliases — used by inline styles in the app logic, values re-pointed */
  --bg:var(--paper); --bg2:var(--paper-2); --surface:var(--white); --surface2:var(--blue-50);
  --olive:var(--blue-600); --olive-d:var(--ink); --olive-l:var(--blue-500); --olive-soft:var(--blue-100);
  --gold:var(--teal-700); --gold-l:var(--teal-600); --gold-soft:var(--teal-100);
  --good:var(--pos-600); --good-bg:var(--pos-100); --mid:var(--mid-600); --mid-bg:var(--mid-100);
  --low:var(--neg-600); --low-bg:var(--neg-100);
  --radius:14px; --radius-s:8px;
  --sh:0 1px 2px rgba(28,43,74,.08); --sh-l:0 6px 18px rgba(28,43,74,.10); --sh-f:0 14px 36px rgba(28,43,74,.16);
  --ease:cubic-bezier(.22,.61,.36,1);
  --font:'Assistant',system-ui,sans-serif; --display:'Heebo',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-weight:400;line-height:1.55;font-size:15px}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue-600)} a:hover{color:var(--blue-700)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:20px;border:3px solid var(--paper)}
::-webkit-scrollbar-track{background:transparent}

/* ===== Shell ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:272px;flex-shrink:0;background:var(--ink);color:#e7ecf5;padding:24px 16px;
  display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar::before{content:'';position:absolute;inset-inline-start:-120px;bottom:-120px;width:340px;height:340px;
  border-radius:50%;pointer-events:none;
  background:
    radial-gradient(circle, transparent 0 38%, rgba(255,255,255,.04) 38% 39%, transparent 39%),
    radial-gradient(circle, transparent 0 56%, rgba(255,255,255,.035) 56% 57%, transparent 57%),
    radial-gradient(circle, transparent 0 74%, rgba(255,255,255,.03) 74% 75%, transparent 75%)}
.brand{display:flex;align-items:center;gap:13px;padding:2px 6px 20px;
  border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:10px;position:relative}
.brand .logo{width:48px;height:48px;flex-shrink:0;display:grid;place-items:center;background:#fff;
  border-radius:50%;box-shadow:none;overflow:hidden}
.brand .logo img{width:48px;height:48px;object-fit:contain}
.brand h1{font-family:var(--display);font-size:17px;font-weight:800;line-height:1.1}
.brand p{font-size:12px;color:rgba(231,236,245,.6);font-weight:400;margin-top:3px;letter-spacing:.01em}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.nav-label{font-size:10.5px;font-weight:700;color:rgba(231,236,245,.42);letter-spacing:.14em;padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--radius-s);
  font-size:14.5px;font-weight:400;color:rgba(231,236,245,.78);transition:background var(--ease) 200ms,color var(--ease) 200ms;
  text-align:right;width:100%;position:relative}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.72;stroke-width:1.7}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(255,255,255,.1);color:#fff;font-weight:700}
.nav-item.active svg{opacity:1;color:#7fb0e6}
.nav-item.active::before{content:'';position:absolute;inset-inline-end:-16px;top:50%;transform:translateY(-50%);
  width:3px;height:26px;background:var(--blue-500)}
.nav-item .badge{margin-inline-start:auto;font-family:var(--display);background:rgba(255,255,255,.14);
  font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px}
.nav-item.lock{opacity:.36;cursor:not-allowed}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);
  display:flex;flex-direction:column;gap:4px;position:relative}
.side-foot button{font-size:13px;color:rgba(231,236,245,.66);padding:8px 12px;border-radius:var(--radius-s);
  display:flex;align-items:center;gap:9px;transition:background var(--ease) 200ms}
.side-foot button:hover{background:rgba(255,255,255,.07);color:#fff}
.side-foot svg{width:15px;height:15px;stroke-width:1.7}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{position:sticky;top:0;z-index:20;background:rgba(242,244,248,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:15px 36px;display:flex;align-items:center;gap:16px}
.topbar .crumb{font-size:12px;color:var(--muted);font-weight:400}
.topbar h2{font-family:var(--display);font-size:21px;font-weight:800;color:var(--ink);margin-top:2px}
.topbar .ctx{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.chip{font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;background:var(--white);
  border:1px solid var(--line);color:var(--ink2);display:inline-flex;align-items:center;gap:7px}
.chip svg{width:14px;height:14px;opacity:.6;stroke-width:1.8}
.view{padding:30px 36px 90px;max-width:1180px;width:100%;margin:0 auto;flex:1}

/* ===== Generic surfaces ===== */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh)}
.section-h{display:flex;align-items:center;gap:11px;margin:0 0 16px}
.section-h h3{font-family:var(--display);font-size:16px;font-weight:800;color:var(--ink)}
.section-h .num{width:26px;height:26px;border-radius:50%;background:var(--blue-600);color:#fff;
  font-family:var(--display);font-size:12.5px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.section-h .num svg{stroke-width:2.2}
.section-h p{font-size:12.5px;color:var(--muted);margin-inline-start:auto;font-weight:400}
.lead{font-size:14.5px;color:var(--muted);max-width:72ch;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;
  padding:11px 20px;border-radius:var(--radius-s);transition:all var(--ease) 200ms;white-space:nowrap}
.btn svg{width:17px;height:17px;stroke-width:2}
.btn-primary{background:var(--blue-600);color:#fff}
.btn-primary:hover{background:var(--blue-700)}
.btn-primary:active{transform:translateY(1px)}
.btn-gold{background:var(--ink);color:#fff}
.btn-gold:hover{background:var(--ink-900)}
.btn-gold:active{transform:translateY(1px)}
.btn-ghost{background:var(--white);border:1px solid var(--line2);color:var(--ink2)}
.btn-ghost:hover{border-color:var(--blue-600);color:var(--blue-700);background:var(--blue-50)}
.btn-ghost:active{transform:translateY(1px)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

label.f{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px;letter-spacing:.01em}
.inp,textarea.inp,select.inp{width:100%;background:var(--white);border:1px solid var(--line2);
  border-radius:var(--radius-s);padding:10px 13px;font-size:14px;transition:all var(--ease) 200ms;color:var(--ink)}
.inp::placeholder,textarea.inp::placeholder{color:var(--faint)}
.inp:focus,textarea.inp:focus,select.inp:focus{outline:none;border-color:var(--blue-500);
  box-shadow:0 0 0 3px rgba(90,151,216,.32)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.muted{color:var(--muted)}
.empty{text-align:center;padding:54px 20px;color:var(--faint)}
.empty svg{width:44px;height:44px;opacity:.5;margin-bottom:14px}
.empty p{font-size:14.5px}

.sc-good{color:var(--good)} .sc-mid{color:var(--mid)} .sc-low{color:var(--low)}
.bg-good{background:var(--good-bg);color:#3d6d14} .bg-mid{background:var(--mid-bg);color:#2f4a78}
.bg-low{background:var(--low-bg);color:var(--low)}

/* ===== Hero / setup ===== */
.hero{background:var(--white);border:1px solid var(--line);border-top:4px solid var(--blue-600);
  border-radius:var(--radius);padding:30px 34px;position:relative;overflow:hidden;
  box-shadow:var(--sh-l);margin-bottom:24px;color:var(--ink)}
.hero::after{content:'';position:absolute;inset-inline-start:-90px;bottom:-140px;width:300px;height:300px;border-radius:50%;
  pointer-events:none;
  background:
    radial-gradient(circle, transparent 0 40%, rgba(35,95,168,.10) 40% 41%, transparent 41%),
    radial-gradient(circle, transparent 0 58%, rgba(35,95,168,.09) 58% 59%, transparent 59%),
    radial-gradient(circle, transparent 0 76%, rgba(120,155,139,.14) 76% 77%, transparent 77%)}
.hero h2{font-family:var(--display);font-size:27px;font-weight:900;color:var(--ink);margin-bottom:10px;position:relative;
  padding-inline-start:16px}
.hero h2::before{content:'';position:absolute;inset-inline-start:0;top:6px;bottom:6px;width:3px;background:var(--teal-600)}
.hero p{font-size:15px;color:var(--muted);max-width:62ch;line-height:1.6;position:relative}
.hero .steps{display:flex;gap:10px;margin-top:22px;position:relative;flex-wrap:wrap}
.hero .step{background:var(--blue-50);border:1px solid var(--blue-100);border-radius:var(--radius-s);
  padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:9px}
.hero .step b{background:var(--blue-600);color:#fff;width:21px;height:21px;border-radius:50%;
  display:grid;place-items:center;font-family:var(--display);font-size:12px;font-weight:800}

.subcard{padding:24px 26px}
.subcard+.subcard{margin-top:16px}
.repeater-row{display:grid;gap:10px;align-items:end;padding:14px;background:var(--blue-50);
  border:1px solid var(--line);border-radius:var(--radius-s);margin-bottom:10px}
.repeater-row.insp{grid-template-columns:1.4fr .8fr 1.2fr auto}
.repeater-row.fw{grid-template-columns:1.6fr 1fr 1.4fr auto}
.icon-btn{width:38px;height:38px;border-radius:var(--radius-s);display:grid;place-items:center;
  background:#fff;border:1px solid var(--line2);color:var(--muted);transition:all var(--ease) 200ms}
.icon-btn:hover{background:var(--low-bg);color:var(--low);border-color:var(--low)}
.icon-btn svg{width:16px;height:16px;stroke-width:1.8}

/* ===== Inspection / criteria ===== */
.fw-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fw-tab{padding:9px 16px;border-radius:999px;background:var(--white);border:1px solid var(--line2);
  font-size:13.5px;font-weight:600;color:var(--ink2);transition:all var(--ease) 200ms;
  display:flex;align-items:center;gap:8px}
.fw-tab .dot{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.fw-tab:hover{border-color:var(--blue-500)}
.fw-tab.active{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}
.fw-tab .pct{font-family:var(--display);font-size:11.5px;font-weight:800;opacity:.72}

.dimbar{display:flex;gap:0;margin-bottom:20px;background:var(--white);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;padding:0}
.dimbar button{flex:1;padding:14px 8px 12px;font-size:13.5px;font-weight:600;color:var(--muted);
  transition:all var(--ease) 200ms;position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;
  border-bottom:3px solid transparent}
.dimbar button+button{border-inline-end:1px solid var(--line)}
.dimbar button .mini{font-family:var(--display);font-size:11px;font-weight:800;color:var(--faint)}
.dimbar button:hover{background:var(--blue-50)}
.dimbar button.active{color:var(--ink);font-weight:800;border-bottom-color:var(--blue-600);background:var(--blue-50)}
.dimbar button.done .mini{color:var(--good)}

.topic{margin-bottom:10px}
.topic-head{display:flex;align-items:center;gap:12px;padding:15px 18px;background:var(--white);
  border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;
  transition:box-shadow var(--ease) 200ms,border-color var(--ease) 200ms;user-select:none}
.topic-head:hover{border-color:var(--line2);box-shadow:var(--sh-l)}
.topic.open .topic-head{border-color:var(--blue-500);border-bottom-left-radius:0;border-bottom-right-radius:0}
.topic-head .tw{font-family:var(--display);font-size:11px;font-weight:800;color:var(--blue-700);
  background:var(--blue-100);padding:3px 9px;border-radius:999px}
.topic-head h4{font-family:var(--display);font-size:15px;font-weight:700;flex:1;color:var(--ink)}
.topic-head .tprog{font-family:var(--display);font-size:12px;font-weight:700;color:var(--faint)}
.topic-head .tscore{font-family:var(--display);font-size:14px;font-weight:800;min-width:46px;text-align:center;
  padding:4px 8px;border-radius:var(--radius-s)}
.topic-head .caret{width:18px;height:18px;color:var(--faint);transition:transform var(--ease) 200ms;stroke-width:2}
.topic.open .caret{transform:rotate(180deg)}
.topic-body{display:none}
.topic.open .topic-body{display:block;animation:fade .2s var(--ease);
  border:1px solid var(--blue-500);border-top:none;border-bottom-left-radius:var(--radius);
  border-bottom-right-radius:var(--radius);background:var(--white);padding:14px 18px 16px}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.ks-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;display:inline-flex;
  align-items:center;gap:5px;white-space:nowrap}
.ks-tag svg{width:12px;height:12px;stroke-width:2.2}
.ks-tag.keep{background:var(--pos-100);color:#3d6d14}
.ks-tag.improve{background:var(--low-bg);color:var(--low)}
.ks-tag.none{background:var(--paper-2);color:var(--muted)}
.ks-tag .auto{font-weight:600;opacity:.7;font-size:9.5px}
.ks-picker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;margin-bottom:12px;
  background:var(--blue-50);border-inline-start:3px solid var(--blue-600);border-radius:var(--radius-s)}
.ks-picker .kp-lbl{font-size:12.5px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.ks-picker .kp-lbl svg{width:15px;height:15px;color:var(--blue-600);stroke-width:2}
.ks-picker .kp-auto{font-size:12px;color:var(--muted)}
.ks-picker .kp-auto b{font-weight:800}
.ks-picker .kp-auto b.keep{color:#3d6d14} .ks-picker .kp-auto b.improve{color:var(--low)}

.crit{padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius-s);margin-bottom:10px;
  background:var(--white);transition:border-color var(--ease) 200ms}
.crit.filled{border-color:var(--blue-100);background:var(--blue-50)}
.crit .ct{font-size:14px;font-weight:700;line-height:1.5;margin-bottom:4px;color:var(--ink)}
.crit .cmeta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.crit .cmeta span{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.crit .cmeta svg{width:13px;height:13px;opacity:.7;flex-shrink:0;stroke-width:1.8}
.crit .cmeta .note{color:var(--teal-700)}
.score-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:2px}
.opts{display:flex;flex-direction:column;gap:6px;width:100%;margin-bottom:10px}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:start;padding:10px 12px;
  border-radius:var(--radius-s);background:var(--white);border:1px solid var(--line);
  transition:all var(--ease) 120ms;line-height:1.5;cursor:pointer}
.opt:hover{border-color:var(--blue-500);background:var(--blue-50)}
.opt .ok{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);background:#fff;
  font-family:var(--display);font-size:11.5px;font-weight:800;color:var(--muted);
  display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt .otx{flex:1;font-size:13.5px;color:var(--ink2)}
.opt .osc{flex-shrink:0;font-family:var(--display);font-size:11.5px;font-weight:800;padding:2px 9px;
  border-radius:999px;background:var(--paper-2);color:var(--muted);margin-top:2px}
.opt.on{border-color:var(--blue-600);background:#fff;box-shadow:0 0 0 1px var(--blue-600) inset}
.opt.on .ok{border-color:transparent;background:var(--blue-600);color:#fff}
.opt.on .otx{font-weight:700;color:var(--ink)}
.opt.on.v-low .osc{background:var(--low);color:#fff} .opt.on.v-mid .osc{background:var(--mid);color:#fff}
.opt.on.v-good .osc{background:var(--good);color:#fff} .opt.on.v-none .osc{background:var(--ink2);color:#fff}
.opt .osc.none{font-size:10.5px;font-weight:700}
.crit-bonus{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;padding:2px 9px;
  border-radius:999px;background:var(--teal-100);color:var(--teal-700);margin-inline-start:8px}
.crit-bonus svg{width:12px;height:12px}
.crit-doconly{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 9px;
  border-radius:999px;background:var(--paper-2);color:var(--muted);margin-inline-start:8px}
.crit-doconly svg{width:12px;height:12px}
.score-num{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:600}
.score-num input{width:62px;text-align:center;padding:7px;font-weight:700}
.score-na{font-size:12.5px;font-weight:600;color:var(--muted);padding:7px 12px;border-radius:var(--radius-s);
  border:1px dashed var(--line2);transition:all var(--ease) 120ms}
.score-na:hover{border-color:var(--muted);color:var(--ink2)}
.score-na.on{background:var(--paper-2);color:var(--ink2);border-style:solid;border-color:var(--line2)}
.crit textarea{min-height:50px}

.flow-foot{display:flex;align-items:center;gap:12px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.flow-foot .spacer{flex:1}

/* ===== Dashboard ===== */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi{padding:22px 24px 20px;position:relative;overflow:hidden}
.kpi .lbl{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;letter-spacing:.01em}
.kpi .val{font-family:var(--display);font-size:38px;font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--ink)}
.kpi .val small{font-size:14px;font-weight:700;color:var(--faint)}
.kpi .tag{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;display:inline-block;margin-top:10px}
.kpi.feature{grid-column:1 / -1;background:var(--ink);color:#fff;border-color:var(--ink);
  display:flex;align-items:center;gap:22px}
.kpi.feature .lbl{margin-bottom:0}
.kpi.feature .tag{margin-top:0;margin-inline-start:auto}
.kpi.feature .lbl{color:rgba(255,255,255,.66)}
.kpi.feature .val{color:#fff}
.kpi.feature .val small{color:rgba(255,255,255,.55)}
.ring{position:absolute;inset-inline-start:14px;bottom:10px;width:54px;height:54px;opacity:.9}

.matrix{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.matrix th,.matrix td{padding:11px 13px;text-align:center;border-bottom:1px solid var(--line)}
.matrix th{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--blue-50);
  position:sticky;top:0;letter-spacing:.02em;border-bottom:1px solid var(--line2)}
.matrix th:first-child,.matrix td:first-child{text-align:right;font-weight:700}
.matrix tr:last-child td{border-bottom:none}
.matrix .cellscore{font-family:var(--display);font-weight:800;padding:5px 9px;border-radius:var(--radius-s);
  display:inline-block;min-width:40px}
.matrix .total-row td{background:var(--blue-50);font-family:var(--display);font-weight:800;color:var(--ink)}
.matrix td.na{color:var(--faint);font-weight:400}

.pattern-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pat-card{padding:20px 22px}
.pat-card h4{font-family:var(--display);font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;
  margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pat-card h4 svg{width:16px;height:16px;stroke-width:2.2}
.pat-card.keep h4{color:#3d6d14} .pat-card.improve h4{color:var(--low)}
.pat-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-s);
  background:var(--blue-50);margin-bottom:7px;font-size:13px;color:var(--ink2)}
.pat-item .pat-score{font-family:var(--display);font-size:12px;font-weight:800;padding:2px 8px;
  border-radius:999px;margin-inline-start:auto}
.pat-item .pat-fw{font-size:11px;color:var(--muted)}

.acc{margin-bottom:10px}
.acc-h{display:flex;align-items:center;gap:10px;padding:14px 17px;background:var(--white);
  border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:700;color:var(--ink)}
.acc-h:hover{border-color:var(--line2)}
.acc-h svg.ic{width:17px;height:17px;color:var(--blue-600);stroke-width:1.9}
.acc-h .caret{margin-inline-start:auto;width:17px;height:17px;color:var(--faint);
  transition:transform var(--ease) 200ms;stroke-width:2}
.acc.open .acc-h{border-color:var(--blue-500);border-bottom-left-radius:0;border-bottom-right-radius:0}
.acc.open .caret{transform:rotate(180deg)}
.acc-b{display:none}
.acc.open .acc-b{display:block;animation:fade .2s var(--ease);background:var(--white);
  border:1px solid var(--blue-500);border-top:none;border-bottom-left-radius:var(--radius);
  border-bottom-right-radius:var(--radius);padding:18px}

.dir-row{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.dir-row .num{width:27px;height:27px;border-radius:50%;background:var(--blue-600);color:#fff;
  font-family:var(--display);font-weight:800;font-size:12.5px;display:grid;place-items:center;flex-shrink:0}
.dir-row input{flex:1}

/* ===== Report ===== */
.report-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.report-toolbar .spacer{flex:1}
.note-banner{background:var(--teal-100);border:1px solid #c8d8d0;border-radius:var(--radius-s);
  padding:13px 16px;font-size:13px;color:#37554a;display:flex;gap:10px;align-items:flex-start;
  margin-bottom:20px;line-height:1.6}
.note-banner svg{width:18px;height:18px;flex-shrink:0;margin-top:2px;stroke-width:1.9}

.paper{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-l);
  padding:48px 54px;max-width:880px;margin:0 auto}
.doc-class{text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3em;
  border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:28px}
.doc-title{text-align:center;margin-bottom:32px}
.doc-title h1{font-family:var(--display);font-size:25px;font-weight:900;color:var(--ink);line-height:1.25}
.doc-title .sub{font-size:14px;color:var(--muted);margin-top:8px}
.rsec{margin-bottom:30px}
.rsec-h{display:flex;align-items:center;gap:11px;margin-bottom:13px;padding-bottom:8px;
  border-bottom:1px solid var(--blue-600)}
.rsec-h .n{width:27px;height:27px;border-radius:50%;background:var(--blue-600);color:#fff;
  font-family:var(--display);font-weight:800;font-size:13px;display:grid;place-items:center;flex-shrink:0}
.rsec-h h3{font-family:var(--display);font-size:17px;font-weight:800;color:var(--ink)}
.rsec p,.rsec li{font-size:14px;line-height:1.7;color:var(--ink2)}
.rsec .kv{display:flex;gap:8px;margin-bottom:5px;font-size:14px}
.rsec .kv b{min-width:130px;color:var(--ink)}
.rsec ul{padding-inline-start:22px;margin:6px 0}
.rsec ul li{margin-bottom:4px}
.rtable{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.rtable th,.rtable td{border:1px solid var(--line);padding:8px 11px;text-align:right;vertical-align:top}
.rtable th{background:var(--blue-50);font-weight:800;color:var(--ink);font-size:12.5px}
.rtable td.c{text-align:center}
.rtable .scorecell{font-family:var(--display);font-weight:800}
.rtable tr.ftopic td{background:var(--blue-50);font-weight:800;color:var(--ink)}
.rtable td.fsub{padding-inline-start:22px;color:var(--ink2)}
.subhead{font-family:var(--display);font-size:14.5px;font-weight:800;color:var(--ink);
  margin:18px 0 7px;display:flex;align-items:center;gap:8px}
.find-groups{margin:6px 0 2px}
.find-topic{font-family:var(--display);font-size:13.5px;font-weight:800;color:var(--ink);margin:12px 0 5px;
  padding-bottom:3px;border-bottom:1px solid var(--blue-100)}
.find-topic:first-child{margin-top:2px}
.find-ul{list-style:none;padding:0;margin:0 0 4px}
.find-ul li{position:relative;padding-inline-start:16px;font-size:13.5px;line-height:1.65;color:var(--ink2);margin-bottom:2px}
.find-ul li::before{content:'';position:absolute;inset-inline-start:3px;top:.62em;width:5px;height:5px;
  border-radius:50%;background:var(--blue-500)}
.find-line{font-size:13.5px;line-height:1.65;color:var(--ink2);margin-bottom:2px}
.subhead .pill{font-family:var(--display);font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px}
.ks-report{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:6px 0 4px}
.ks-col h4{font-family:var(--display);font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;
  padding-bottom:7px;margin-bottom:10px;border-bottom:2px solid}
.ks-col h4 svg{width:16px;height:16px;stroke-width:2.2}
.ks-col.keep h4{color:#3d6d14;border-color:var(--pos-600)}
.ks-col.improve h4{color:var(--low);border-color:var(--neg-600)}
.ks-col h4 .cnt{margin-inline-start:auto;font-size:11.5px;font-weight:800;background:var(--blue-100);
  color:var(--blue-700);padding:1px 9px;border-radius:999px}
.ks-entry{border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;margin-bottom:8px;
  background:var(--blue-50)}
.ks-entry .kh{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:3px}
.ks-entry .kh b{font-family:var(--display);font-size:13px;font-weight:800;color:var(--ink)}
.ks-entry .kh .area{font-size:11px;color:var(--muted);font-weight:600}
.ks-entry .kh .sc{font-family:var(--display);font-size:11px;font-weight:800;padding:1px 8px;
  border-radius:999px;margin-inline-start:auto}
.ks-crits{margin-top:8px;border-top:1px solid var(--line);padding-top:7px}
.ks-crit{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;line-height:1.5;padding:5px 0}
.ks-crit+.ks-crit{border-top:1px solid var(--line)}
.ks-crit .cscore{flex-shrink:0;font-family:var(--display);font-size:10.5px;font-weight:800;padding:1px 7px;
  border-radius:999px;min-width:34px;text-align:center;background:var(--paper-2);color:var(--muted);margin-top:1px}
.ks-crit .ctxt{flex:1;color:var(--ink2)}
.ks-crit .ctxt b{display:block;font-weight:700;color:var(--ink);font-size:12px}
.ks-crit .ctxt .cans{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.ks-empty{font-size:12.5px;color:var(--muted);padding:8px 2px}
@media print{.ks-report{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.ks-report{grid-template-columns:1fr}}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);
  color:#fff;padding:12px 22px;border-radius:var(--radius-s);font-size:13.5px;font-weight:700;
  box-shadow:var(--sh-f);opacity:0;pointer-events:none;transition:all var(--ease) 250ms;z-index:100;
  display:flex;align-items:center;gap:9px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:17px;height:17px;color:#7fb0e6;stroke-width:2.2}

/* ===== recommendation generator ===== */
.gen-hero{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  background:var(--white);border:1px solid var(--line);border-inline-start:4px solid var(--teal-600);
  border-radius:var(--radius);padding:20px 22px;margin:0 0 22px;box-shadow:var(--sh)}
.gen-hero-txt h3{font-family:var(--display);display:flex;align-items:center;gap:9px;font-size:16px;
  font-weight:800;color:var(--ink)}
.gen-hero-txt h3 .spark{color:var(--teal-700);width:18px;height:18px;flex-shrink:0}
.gen-hero-txt p{font-size:12.5px;color:var(--muted);margin-top:6px;max-width:58ch;line-height:1.6}
.gen-all-btn{flex-shrink:0;white-space:nowrap}
.gen-all-btn svg{animation:sparkle 2.6s var(--ease) infinite}
@keyframes sparkle{0%,100%{opacity:.85}50%{opacity:1}}
.gen-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.gen-hint{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.gen-hint svg{width:14px;height:14px;color:var(--blue-600);flex-shrink:0;opacity:.8;stroke-width:1.8}
@media print{.gen-hero,.gen-row{display:none!important}}

/* topic tools */
.topic-tools{display:flex;gap:8px;margin-bottom:12px}
.tt-btn{font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--white);
  border:1px solid var(--line2);color:var(--muted);transition:all var(--ease) 140ms;
  display:inline-flex;align-items:center;gap:5px}
.tt-btn svg{width:13px;height:13px;stroke-width:2}
.tt-btn:hover{border-color:var(--blue-500);color:var(--blue-700)}
.tt-btn.on{background:var(--teal-100);border-color:var(--teal-600);color:var(--teal-700)}
.topic.topic-na .topic-head{opacity:.55}

/* framework score summary */
.fw-summary{background:none;border:none;border-radius:0;padding:0;margin:0 0 20px;box-shadow:none}
.fws-h{font-family:var(--display);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;
  color:var(--ink);margin-bottom:12px;letter-spacing:.01em}
.fws-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fws-item{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;
  border-radius:var(--radius-s);background:var(--paper);border:1px solid var(--line)}
.fws-item.cur{border-color:var(--blue-500);background:var(--blue-50)}
.fws-item.total{background:var(--ink);border-color:var(--ink)}
.fws-lbl{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center}
.fws-item.total .fws-lbl{color:rgba(255,255,255,.7)}
.fws-item.total .fws-val{color:#fff}
.fws-val{font-family:var(--display);font-size:22px;font-weight:900;color:var(--ink);min-width:38px;
  text-align:center;padding:0;background:none!important}
.fws-note{font-size:11px;color:var(--muted);margin-top:9px}
@media (max-width:680px){.fws-grid{grid-template-columns:repeat(2,1fr)}}

@media(max-width:900px){
  .sidebar{display:none}
  .kpi-row{grid-template-columns:1fr 1fr}
  .pattern-grid,.grid2,.grid3{grid-template-columns:1fr}
  .view,.topbar{padding-left:18px;padding-right:18px}
  .paper{padding:26px 20px}
}
/* print */
@media print{
  @page{margin:14mm}
  body{background:#fff}
  .sidebar,.topbar,.report-toolbar,.note-banner,.no-print{display:none!important}
  .main,.view{padding:0;margin:0;max-width:none}
  .paper{box-shadow:none;border:none;border-radius:0;padding:0;max-width:none}
  .rsec{page-break-inside:avoid}
  .rtable{font-size:11px}
  .paper,.paper *{color:#000!important;background:#fff!important;box-shadow:none!important}
  .paper .rsec-h .n{border:1.2px solid #000!important;color:#000!important;background:#fff!important}
  .paper .cbadge,.paper .sc,.paper .tscore,.paper .kstag{
    border:1px solid #555!important;color:#000!important;background:#fff!important}
  .paper .rtable th,.paper .rtable td{border-color:#999!important}
  .paper hr,.paper .ks-crits{border-color:#bbb!important}
  .paper .find-ul li::before{background:#000!important}
  .paper .find-topic{border-bottom-color:#999!important}
}
/* ---- הערות שוליים מהמסמך: מספר צמוד למילה + בלונית בלחיצה ---- */
.fnw{border-bottom:1px dotted var(--olive-l)}
.fnr{display:inline-block;font-size:9.5px;font-weight:800;line-height:1;vertical-align:super;
  color:var(--olive-d);background:var(--olive-soft);border:1px solid var(--olive-l);border-radius:20px;
  padding:2px 5px;margin-inline-start:2px;cursor:pointer;transition:.12s var(--ease);position:relative;top:-1px}
.fnr:hover,.fnr.on{background:var(--olive);border-color:var(--olive);color:#fff}
#fnpop{position:fixed;z-index:400;max-width:340px;background:var(--ink-900);color:#fff;border-radius:var(--radius-s);
  padding:10px 13px;font-size:12.5px;line-height:1.6;font-weight:500;box-shadow:var(--sh-f);
  opacity:0;transform:translateY(4px);pointer-events:none;transition:.14s var(--ease)}
#fnpop.show{opacity:1;transform:none;pointer-events:auto}
#fnpop .fnh{display:block;font-size:10.5px;font-weight:800;opacity:.65;margin-bottom:3px}
#fnpop .fnh b{color:var(--gold-l)}
@media print{.fnr{border:0;background:none;color:#000;padding:0}#fnpop{display:none!important}}
</style>
</head>

<script>
/* ============ Inspection App Logic ============ */
const FW_DIMS = ['prog','cmd','trainee'];
const DIM_META = {
  gph:    {label:'רמת חטיבה (גפ"ה)', short:'גפ"ה', color:'#1e3f68'},
  prog:   {label:'תכנית הכשרה',      short:'תכנית', color:'#2d5b8e'},
  cmd:    {label:'סגל',               short:'סגל',   color:'#3b7ea8'},
  trainee:{label:'חניכים',            short:'חניכים',color:'#5a6f9c'},
};
const ICONS = {
  home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  brigade:'<path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/>',
  framework:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  dash:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',
  report:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  talk:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  note:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  spark:'<path d="M13 3l2.2 5.8L21 11l-5.8 2.2L13 19l-2.2-5.8L5 11l5.8-2.2z"/>',
};
const SPARK = ICONS.spark;

const BLANK = () => ({
  meta:{unit:'',dateFrom:'',dateTo:'',name:'',type:'אינטגרטיבית',integrative:'',
        commander:{name:'',rank:'',role:''},methodBrigade:'',methodFramework:''},
  inspectors:[], frameworks:[],
  gph:{}, fw:{},
  topicNA:{},
  report:{directives:['','',''],summary:'',trendsKeep:'',trendsImprove:'',recommendations:'',crossCut:'',brigadeMethod:'',brigadeGeneral:''},
  ui:{activeFw:null, dim:'prog'}
});
let S = BLANK();
let nav = 'home';

/* ---------- persistence ---------- */
const LS='idf_insp_v1';
function save(){ try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} }
function load(){ try{const r=localStorage.getItem(LS); if(r){S=Object.assign(BLANK(),JSON.parse(r)); S.ui=S.ui||{dim:'prog',activeFw:null}; S.topicNA=S.topicNA||{}; delete S.ks; delete S.pinned; S.report=Object.assign({directives:['','',''],summary:'',trendsKeep:'',trendsImprove:'',recommendations:'',crossCut:'',brigadeMethod:'',brigadeGeneral:''},S.report||{});}}catch(e){} }
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------- scoring engine ---------- */
function band(v){
  if(v==null) return {t:'—',c:'',k:''};
  if(v>=90) return {t:'מצוין',c:'sc-good',k:'good'};
  if(v>=80) return {t:'טוב מאוד',c:'sc-good',k:'good'};
  if(v>=70) return {t:'טוב',c:'sc-mid',k:'mid'};
  if(v>=60) return {t:'מספק',c:'sc-mid',k:'mid'};
  return {t:'דורש שיפור',c:'sc-low',k:'low'};
}
function vclass(v){ if(v==null)return''; return v>=80?'v-good':v>=65?'v-mid':'v-low'; }
function cellKey(ti,ci){ return ti+'_'+ci; }
function gphCell(ti,ci){ return S.gph[cellKey(ti,ci)]||null; }
function fwCell(fwId,dim,ti,ci){ return (S.fw[fwId]&&S.fw[fwId][dim]&&S.fw[fwId][dim][cellKey(ti,ci)])||null; }
function setGph(ti,ci,patch){ const k=cellKey(ti,ci); S.gph[k]=Object.assign({score:null,opt:null},S.gph[k],patch); save(); }
function setFw(fwId,dim,ti,ci,patch){ S.fw[fwId]=S.fw[fwId]||{}; S.fw[fwId][dim]=S.fw[fwId][dim]||{}; const k=cellKey(ti,ci);
  S.fw[fwId][dim][k]=Object.assign({score:null,opt:null},S.fw[fwId][dim][k],patch); save(); }

function topicScore(topic, getter){
  let ws=0,acc=0,any=false;
  topic.crits.forEach((c,ci)=>{
    if(c.w==null) return;
    const cell=getter(ci);
    if(!cell||cell.score==null) return;
    ws+=c.w; acc+=c.w*cell.score; any=true;
  });
  return (any&&ws>0)?acc/ws:null;
}
function dimScore(scope, dim, topics, topicGetter){
  let ws=0,acc=0,any=false;
  topics.forEach((t,ti)=>{
    if(!t.scored||!t.w||isTopicNA(scope,dim,ti)) return;
    const ts=topicScore(t,(ci)=>topicGetter(ti,ci));
    if(ts==null) return;
    ws+=t.w; acc+=t.w*ts; any=true;
  });
  return (any&&ws>0)?acc/ws:null;
}
const gphScore = ()=> dimScore('gph','gph',DATA.gph,(ti,ci)=>gphCell(ti,ci));
const fwDimScore = (fwId,dim)=> dimScore(fwId,dim,DATA[dim],(ti,ci)=>fwCell(fwId,dim,ti,ci));
function fwScore(fwId){
  const vals=['prog','cmd','trainee'].map(d=>fwDimScore(fwId,d)).filter(v=>v!=null);
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function dimAvgAcrossFw(dim){
  const vals=S.frameworks.map(f=>fwDimScore(f.id,dim)).filter(v=>v!=null);
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function overallScore(){
  const parts=[gphScore(),dimAvgAcrossFw('prog'),dimAvgAcrossFw('cmd'),dimAvgAcrossFw('trainee')].filter(v=>v!=null);
  return parts.length? parts.reduce((a,b)=>a+b,0)/parts.length : null;
}

/* ---------- סיווג שימור / שיפור ----------
   הסיווג נגזר אך ורק מהציון הסופי של הנושא / הקריטריון, ללא כל סימון ידני:
     ציון <  70  =>  שיפור
     ציון >= 70  =>  שימור
   נושא ללא ציון (טרם דורג / N/A / סעיף שאינו מחושב בציון) אינו מסווג כלל
   ומוחזר null — ולכן אינו נכנס לרשימות השיפור/שימור בדו"ח. */
const KS_THRESHOLD = 70;
function ksKey(scope,dim,ti){ return scope+'|'+dim+'|'+ti; }
function ksLabel(cls){ return cls==='keep' ? 'שימור' : cls==='improve' ? 'שיפור' : ''; }
function ksAuto(score){
  if(score==null || typeof score!=='number' || !isFinite(score)) return null;
  return score>=KS_THRESHOLD ? 'keep' : 'improve';
}
/* ---------- נושא כ"לא רלוונטי / לא נבדק" — יוצא לגמרי מחישוב הציון ---------- */
function isTopicNA(scope,dim,ti){ return !!S.topicNA[ksKey(scope,dim,ti)]; }
function toggleTopicNA(scope,dim,ti){ const k=ksKey(scope,dim,ti); if(S.topicNA[k])delete S.topicNA[k]; else S.topicNA[k]=true; save(); render(); }
/* ממוצע ציוני כלל הנושאים בקטגוריה (ממד) בהינתן getter לתא, וסיווגה */
function dimTopicAvg(scope, dim, getter){
  const topics=DATA[dim]||[];
  const vals=topics.map((t,ti)=> (t.scored&&!isTopicNA(scope,dim,ti))?topicScore(t,(ci)=>getter(ti,ci)):null).filter(v=>v!=null);
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}


/* progress */
function dimProgress(getter, topics){
  let done=0,tot=0;
  topics.forEach((t,ti)=> t.crits.forEach((c,ci)=>{ if(c.w==null)return; tot++; const cell=getter(ti,ci); if(cell&&cell.score!=null)done++; }));
  return {done,tot,pct:tot?Math.round(done/tot*100):0};
}
function fwProgress(fwId){
  let done=0,tot=0;
  FW_DIMS.forEach(dim=>{ const p=dimProgress((ti,ci)=>fwCell(fwId,dim,ti,ci),DATA[dim]); done+=p.done; tot+=p.tot; });
  return {done,tot,pct:tot?Math.round(done/tot*100):0};
}

/* ---------- helpers ---------- */
function svg(p,extra=''){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(v){ return v==null?'—':Math.round(v); }
function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=svg(ICONS.check)+esc(msg); t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function ranges(){ const m=S.meta; if(m.dateFrom&&m.dateTo) return `${m.dateFrom} – ${m.dateTo}`; return m.dateFrom||m.dateTo||''; }

/* ============ NAV ============ */
function renderNav(){
  const ready = S.frameworks.length>0;
  const items=[
    {k:'home',label:'בית והקמת ביקורת',icon:ICONS.home},
    {k:'brigade',label:'ביקורת רמת חטיבה',icon:ICONS.brigade,badge:band(gphScore()).t!=='—'?fmt(gphScore()):''},

  ];
  document.getElementById('nav').innerHTML = items.map(it=>{
    const cls = 'nav-item'+(nav===it.k?' active':'')+(it.lock?' lock':'');

    return `<button class="${cls}" onclick="${it.lock?'':`go('${it.k}')`}">${svg(it.icon)}<span>${it.label}</span>${badge}</button>`;
  }).join('');
}
function go(k){ nav=k; render(); window.scrollTo(0,0); }

/* ============ RENDER ROUTER ============ */
const TITLES={home:['הקמת ביקורת','הגדרת מסגרת הביקורת, צוות הבקרים והמסגרות הנבדקות'],
  brigade:['ביקורת רמת חטיבה — גפ"ה','בחינת קיום נהלי הדרכה ברמת היחידה / מד"ריה / גפ"ה'],
  fw:['ביקורת מסגרת','איסוף נתונים בשטח לפי שלושת ממדי ההדרכה'],

  report:['מחולל דו"ח הסיכום','הפקה אוטומטית של דו"ח מובנה ושמירתו כ-PDF']};
function render(){
  FN_STORE.length=0; fnHide();     // מאגר ההערות נבנה מחדש בכל רינדור
  renderNav();
  const t=TITLES[nav]; document.getElementById('ptitle').textContent=t[0]; document.getElementById('crumb').textContent=t[1];

</div>`; }

/* ============ CRITERIA RENDERER (shared) ============ */
function renderTopic(dimKey,topics,ti,getter,onScore,onNA,scope){
  const t=topics[ti];
  const na=isTopicNA(scope,dimKey,ti);
  let done=0,tot=0;
  t.crits.forEach((c,ci)=>{ if(c.w==null)return; tot++; const cell=getter(ti,ci); if(cell&&cell.score!=null)done++; });
  const ts=(t.scored&&!na)? topicScore(t,(ci)=>getter(ti,ci)) : null;
  const b=band(ts);
  const open = t._open?'open':'';
  const tscoreHtml = na ? `<span class="tscore" style="background:var(--bg2);color:var(--muted);font-size:11px">לא רלוונטי</span>`
    : t.scored ? `<span class="tscore ${b.k?'bg-'+b.k:''}">${ts==null?'—':Math.round(ts)}</span>`
    : `<span class="tscore" style="background:var(--bg2);color:var(--muted);font-size:11px">איכותי</span>`;
  const topicTools=`<div class="topic-tools" onclick="event.stopPropagation()">
      <button class="tt-btn ${na?'on':''}" onclick="toggleTopicNA('${scope}','${dimKey}',${ti})" title="סמן נושא כלא רלוונטי / לא נבדק">${svg('<circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/>')}לא רלוונטי</button>
    </div>`;
  return `<div class="topic ${open} ${na?'topic-na':''}" id="tp_${dimKey}_${ti}">
    <div class="topic-head" onclick="toggleTopic('${dimKey}',${ti})">
      ${t.w?`<span class="tw">${Math.round(t.w*100)}%</span>`:''}
      <h4>${esc(t.name)}</h4>
      ${(t.scored&&!na)?ksTagHTML(scope,dimKey,ti,ts):''}
      ${tot?`<span class="tprog">${done}/${tot}</span>`:''}
      ${tscoreHtml}
      <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="topic-body">
      ${topicTools}
      ${(t.scored&&!na)?ksPickerHTML(scope,dimKey,ti,ts):''}
      ${na?`<p class="muted" style="font-size:13px;padding:4px 2px 12px">הנושא סומן כלא רלוונטי / לא נבדק ואינו נכלל בחישוב הציון.</p>`:''}
      ${t.crits.map((c,ci)=>renderCrit(dimKey,ti,ci,c,getter(ti,ci),onScore,onNA)).join('')}
    </div>
  </div>`;
}
/* תגית שיפור/שימור בכותרת הנושא — נגזרת אוטומטית מהציון בלבד */
function ksTagHTML(scope,dim,ti,score){
  const cls=ksAuto(score);
  if(cls==null) return `<span class="ks-tag none">טרם דורג</span>`;
  const ic=cls==='keep'?'<path d="M20 6L9 17l-5-5"/>':'<path d="M12 20V10M6 20V4M18 20v-7"/>';
  return `<span class="ks-tag ${cls}" id="kstag_${dim}_${ti}">${svg(ic)}${ksLabel(cls)}</span>`;
}
/* שורת הסיווג בגוף הנושא — תצוגה בלבד, ללא אפשרות בחירה ידנית */
function ksPickerHTML(scope,dim,ti,score){
  const cls=ksAuto(score);
  const txt = cls==null ? 'טרם נבחרו אפשרויות בנושא — הנושא אינו נכלל בריכוז השיפור/שימור'
    : `ציון הנושא ${Math.round(score)} ${cls==='keep'?'&ge;':'&lt;'} ${KS_THRESHOLD} ולכן הנושא מסווג <b class="${cls}">${ksLabel(cls)}</b>`;
  return `<div class="ks-picker" id="kspick_${dim}_${ti}">
    <span class="kp-lbl">${svg('<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>')}סיווג הנושא</span>
    <span class="kp-auto">${txt}</span>
  </div>`;
}
function renderCrit(dimKey,ti,ci,c,cell,onPick,onNA){
  const opts = c.opts||[];
  const scored = c.w!=null;              // סעיף שאינו משוקלל — נבחר לתיעוד בלבד
  const cur = cell?cell.score:null;
  const curOpt = cell&&cell.opt!=null ? cell.opt : null;
  const na = cell&&cell.score===null&&cell.naMark;
  const filled = curOpt!=null;
  const optsHTML = `<div class="opts">${opts.map((o,oi)=>{
      const on = curOpt===o.k;
      const vc = o.s==null?'v-none':o.s>=80?'v-good':o.s>=60?'v-mid':'v-low';
      const badge = o.s==null ? `<span class="osc none">ללא ציון</span>` : `<span class="osc">${o.s}</span>`;
      return `<button class="opt ${on?'on '+vc:''}" onclick="${onPick}('${dimKey}',${ti},${ci},'${o.k}')">
        <span class="ok">${o.k}</span><span class="otx">${fnText(o.t,o.fn)}</span>${badge}</button>`;}).join('')}</div>
    <button class="score-na ${na?'on':''}" onclick="${onNA}('${dimKey}',${ti},${ci})">לא רלוונטי</button>`;
  const tag = c.bonus ? `<span class="crit-bonus">${svg(SPARK)}שאלת בונוס</span>`
            : !scored ? `<span class="crit-doconly">${svg(ICONS.note)}לתיעוד בלבד — אינו משוקלל בציון</span>` : '';
  return `<div class="crit ${filled?'filled':''}">
    <div class="ct">${fnText(c.t,c.fn)}${tag}</div>
    <div class="cmeta">
      ${c.c?`<span>${svg(ICONS.talk)}${esc(c.c)}</span>`:''}
      ${c.note?`<span class="note">${svg(ICONS.note)}${esc(c.note)}</span>`:''}
    </div>
    <div class="score-row">${optsHTML}</div>
  </div>`;
}
/* חיפוש אפשרות לפי אות; מחזיר את האפשרות או null */
function critOpt(c,k){ return (c&&c.opts||[]).find(o=>o.k===k)||null; }

/* ---------- הערות שוליים מהמסמך ----------
   כל הערה נצמדת למילה מסוימת בטקסט. fnText() מחזיר את הטקסט מוגן-HTML,
   כשאחרי כל מילה מסומנת נשתל מספר ההערה. הנוסח עצמו נקרא בבלונית. */
const FN_STORE = [];
function fnText(txt, fns){
  let html = esc(txt);
  (fns||[]).forEach(f=>{
    const w = esc(f.w);
    const i = html.indexOf(w);
    if(i<0) return;                                  // המילה לא נמצאה — הטקסט נשאר כמות שהוא
    const id = FN_STORE.push(f) - 1;
    html = html.slice(0,i+w.length)
         + `<sup class="fnr" onclick="fnShow(event,${id})">${f.n}</sup>`
         + html.slice(i+w.length);
    html = html.slice(0,i) + '<span class="fnw">' + html.slice(i, i+w.length) + '</span>'
         + html.slice(i+w.length);
  });
  return html;
}
let fnOpen = null;
function fnPop(){ let e=document.getElementById('fnpop');
  if(!e){ e=document.createElement('div'); e.id='fnpop'; document.body.appendChild(e); } return e; }
function fnHide(){ const e=document.getElementById('fnpop'); if(e)e.classList.remove('show');
  if(fnOpen){ fnOpen.classList.remove('on'); fnOpen=null; } }
/* מיקום הבלונית ביחס לסימן — נקרא גם בגלילה כדי שתמשיך לעקוב אחריו */
function fnPlace(el){
  const e=document.getElementById('fnpop'); if(!e||!el) return;
  const r=el.getBoundingClientRect(), pw=e.offsetWidth, ph=e.offsetHeight;
  let left = Math.max(8, Math.min(r.right - pw, window.innerWidth - pw - 8));   // יישור לימין הסימן (RTL)
  let top  = r.bottom + 8;
  if(top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 8);
  e.style.left = left+'px'; e.style.top = top+'px';
}
function fnShow(ev,id){
  ev.stopPropagation(); ev.preventDefault();          // הסימן יושב בתוך כפתור האפשרות
  const el=ev.currentTarget, f=FN_STORE[id];
  if(fnOpen===el){ fnHide(); return; }
  fnHide();
  if(!f) return;
  const e=fnPop();
  e.innerHTML=`<span class="fnh">הערה <b>${f.n}</b> במסמך הקריטריונים · «${esc(f.w)}»</span>${esc(f.t)}`;
  e.classList.add('show');
  el.classList.add('on'); fnOpen=el;
  fnPlace(el);
}
document.addEventListener('click', fnHide);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') fnHide(); });
window.addEventListener('resize', ()=>fnPlace(fnOpen));
window.addEventListener('scroll', ()=>fnPlace(fnOpen), true);
function toggleTopic(dimKey,ti){

}

/* בחירת אפשרות מבנק התשובות — הציון נגזר מהאפשרות ואינו מוזן ידנית.
   לחיצה חוזרת על אותה אפשרות מבטלת את הבחירה. */
function pickGph(_,ti,ci,k){ const c=DATA.gph[ti].crits[ci]; const cur=gphCell(ti,ci);

  if(cur&&cur.opt===k){ setFw(fid,dim,ti,ci,{opt:null,score:null,naMark:false}); }

/* refresh just topic header score + dim bar without full rerender (keeps textareas focused) */
function refreshTopic(dimKey,ti){
  const topics = dimKey==='gph'?DATA.gph:DATA[dimKey];
  const t=topics[ti];
  const getter = dimKey==='gph'? gphCell : (a,b)=>fwCell(S.ui.activeFw,dimKey,a,b);
  let done=0,tot=0; t.crits.forEach((c,ci)=>{if(c.w==null)return;tot++;const cell=getter(ti,ci);if(cell&&cell.score!=null)done++;});
  const scope = dimKey==='gph' ? 'gph' : S.ui.activeFw;
  const ts=(t.scored&&!isTopicNA(scope,dimKey,ti))?topicScore(t,(ci)=>getter(ti,ci)):null; const b=band(ts);
  const el=document.getElementById('tp_'+dimKey+'_'+ti);
  if(el){ const sc=el.querySelector('.tscore'); const pr=el.querySelector('.tprog');
    if(sc&&t.scored){sc.className='tscore '+(b.k?'bg-'+b.k:''); sc.textContent=ts==null?'—':Math.round(ts);}
    if(pr)pr.textContent=done+'/'+tot;
    // refresh keep/improve tag + picker
    if(t.scored){
      const tag=el.querySelector('.ks-tag'); if(tag){ const nt=document.createElement('div'); nt.innerHTML=ksTagHTML(scope,dimKey,ti,ts); tag.replaceWith(nt.firstChild); }
      const pick=el.querySelector('.ks-picker'); if(pick){ const np=document.createElement('div'); np.innerHTML=ksPickerHTML(scope,dimKey,ti,ts); pick.replaceWith(np.firstChild); }
    }
    // refresh crit chip states in this topic
    t.crits.forEach((c,ci)=>{ const cell=getter(ti,ci); const cur=cell?cell.score:null;
      const crit=el.querySelectorAll('.crit')[ci]; if(!crit)return;
      crit.classList.toggle('filled',cell&&cell.opt!=null);
      const curOpt=cell&&cell.opt!=null?cell.opt:null;
      crit.querySelectorAll('.opt').forEach((btn,k)=>{ const o=(c.opts||[])[k]; if(!o)return;
        const on=curOpt===o.k; const vc=o.s==null?'v-none':o.s>=80?'v-good':o.s>=60?'v-mid':'v-low';
        btn.className='opt'+(on?(' on '+vc):''); });
      const na=crit.querySelector('.score-na'); if(na)na.classList.toggle('on',cell&&cell.score===null&&cell.naMark);
    });
  }
  // refresh nav badge + dimbar
  renderNav();
  if(nav==='fw'){ document.querySelectorAll('.dimbar button').forEach((btn,i)=>{ const d=FW_DIMS[i]; const p=dimProgress((a,b)=>fwCell(S.ui.activeFw,d,a,b),DATA[d]);
    const mini=btn.querySelector('.mini'); if(mini)mini.textContent=`${p.done}/${p.tot}${p.pct===100?' ✓':''}`; btn.classList.toggle('done',p.pct===100); }); }
}

function detectPatterns(){
  const keep=[],improve=[];
  ['prog','cmd','trainee'].forEach(dim=>{
    DATA[dim].forEach((t,ti)=>{ if(!t.scored)return;
      const scores=S.frameworks.filter(f=>!isTopicNA(f.id,dim,ti)).map(f=>topicScore(t,(ci)=>fwCell(f.id,dim,ti,ci))).filter(v=>v!=null);
      if(scores.length<2)return;
      const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
      const lowN=scores.filter(s=>s<=70).length, highN=scores.filter(s=>s>=85).length;
      if(highN>=2&&avg>=85) keep.push({name:t.name+' · '+DIM_META[dim].short,avg,fw:highN});
      if(lowN>=2&&avg<=70) improve.push({name:t.name+' · '+DIM_META[dim].short,avg,fw:lowN});
    });
  });
  keep.sort((a,b)=>b.avg-a.avg); improve.sort((a,b)=>a.avg-b.avg);
  return {keep:keep.slice(0,6),improve:improve.slice(0,6)};
}
function suggestTrends(){
  const p=detectPatterns();
  if(p.keep.length&&!S.report.trendsKeep.trim()) S.report.trendsKeep=p.keep.map(x=>'• '+x.name+' (ממוצע '+x.avg+')').join('\n');
  if(p.improve.length&&!S.report.trendsImprove.trim()) S.report.trendsImprove=p.improve.map(x=>'• '+x.name+' (ממוצע '+x.avg+')').join('\n');
  save(); render(); toast('נוסחה טיוטה לפי המגמות שזוהו');
}

/* קבוצת שמות כל הנושאים — לזיהוי כותרות גם בתוכן ישן שנשמר ללא הסימון ## */
const ALL_TOPIC_NAMES = (()=>{ const s=new Set();
  ['gph','prog','cmd','trainee'].forEach(d=>(DATA[d]||[]).forEach(t=>s.add(t.name))); return s; })();
/* עיבוד תוכן שדה ממצאים למבנה: שורת "## X" = כותרת נושא, "• Y" = בולט, אחר = שורה רגילה */
function findingsBlockHTML(txt){
  const raw=(txt||'').replace(/\s+$/,'');
  if(!raw.trim()) return '<p style="white-space:pre-line">—</p>';
  const lines=raw.split('\n');
  let html='', bulletsOpen=false, groupsOpen=false;
  const closeBul=()=>{ if(bulletsOpen){ html+='</ul>'; bulletsOpen=false; } };
  lines.forEach(line=>{
    const t=line.trim();
    if(!t){ closeBul(); return; }
    if(t.startsWith('## ') || ALL_TOPIC_NAMES.has(t)){   // כותרת נושא (כולל תוכן ישן ללא ##)
      closeBul();
      if(!groupsOpen){ html+='<div class="find-groups">'; groupsOpen=true; }
      html+=`<div class="find-topic">${esc(t.startsWith('## ')?t.slice(3).trim():t)}</div>`;
    } else if(t.startsWith('•')){                   // בולט
      if(!bulletsOpen){ html+='<ul class="find-ul">'; bulletsOpen=true; }
      html+=`<li>${esc(t.replace(/^•\s*/,''))}</li>`;
    } else {                                        // טקסט חופשי (עריכה ידנית)
      closeBul();
      html+=`<p class="find-line">${esc(t)}</p>`;
    }
  });
  closeBul();
  if(groupsOpen) html+='</div>';
  return html;
}

function findingsTable(dimKey,topics,getter){
  const dim = dimKey==='gph'?'gph':dimKey;
  const rows=topics.map((t,ti)=>{
    if(!t.scored) return '';
    const ts=topicScore(t,(ci)=>getter(ti,ci));
    const crits=topicCrits(dim,ti,getter);
    if(ts==null&&!crits.length) return '';
    // שורת הנושא הכללי, ומתחתיה שורה לכל תת-נושא עם התשובה שנבחרה
    const head=`<tr class="ftopic"><td><b>${esc(t.name)}</b></td><td class="c">—</td>
      <td class="c"><b>${ts==null?'—':Math.round(ts)}</b></td></tr>`;
    const sub=crits.map(c=>`<tr><td class="fsub">${esc(c.t)}</td>
      <td>${esc(c.optText)}</td><td class="c">${c.score==null?'—':c.score}</td></tr>`).join('');
    return head+sub;
  }).filter(Boolean).join('');
  if(!rows) return '';
  return `<table class="rtable"><thead><tr><th style="width:34%">נושא / תת-נושא</th>
    <th>התשובה שנבחרה</th><th style="width:9%" class="c">ציון</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function brigadeFindings(){
  const tbl=findingsTable('gph',DATA.gph,gphCell);
  if(!tbl) return '';
  return `<div class="subhead">ברמת החטיבה — מסגרת הגפ"ה / מד"ריה <span class="pill bg-${band(gphScore()).k}">${fmt(gphScore())}</span></div>${tbl}`;
}
function frameworkFindings(f){
  const parts=FW_DIMS.map(d=>{
    const tbl=findingsTable(d,DATA[d],(ti,ci)=>fwCell(f.id,d,ti,ci));

  }).filter(Boolean).join('');

}

const SHORT2DIM = {};
Object.keys(DIM_META).forEach(d=>{ SHORT2DIM[DIM_META[d].short]=d; });
function kbOf(dim,name){ return (KB[dim]&&KB[dim][name])||{ref:'',fix:'לטפל בפער שזוהה ולהביא את הנושא לעמידה בנוהל'}; }


/* סריקת כלל הממצאים שהוזנו — חטיבה + מסגרות × ממדים */
function scanFindings(){
  const out=[];
  DATA.gph.forEach((t,ti)=>{ if(!t.scored||isTopicNA('gph','gph',ti))return;
    const sc=topicScore(t,(ci)=>gphCell(ti,ci));
    const finds=topicCrits('gph',ti,gphCell).filter(c=>c.score!=null&&c.score<70).map(c=>c.optText);
    if(sc==null&&!finds.length)return;
    out.push({dim:'gph',name:t.name,scope:'רמת החטיבה (גפ"ה)',score:sc,find:finds.join('; ')});
  });
  S.frameworks.forEach(f=>{
    FW_DIMS.forEach(dim=>{
      DATA[dim].forEach((t,ti)=>{ if(!t.scored||isTopicNA(f.id,dim,ti))return;
        const sc=topicScore(t,(ci)=>fwCell(f.id,dim,ti,ci));
        const finds=topicCrits(dim,ti,(a,b)=>fwCell(f.id,dim,a,b)).filter(c=>c.score!=null&&c.score<70).map(c=>c.optText);
        if(sc==null&&!finds.length)return;
        out.push({dim,name:t.name,scope:(f.label||'מסגרת')+' · '+DIM_META[dim].short,score:sc,find:finds.join('; ')});
      });
    });
  });
  return out;
}

/* ====== איסוף סיווג שיפור/שימור לדוח ======
   scanKS(): כל נושא שדורג — שמו, ציונו הסופי, סיווגו, ופירוט תתי-הנושאים
   (הקריטריונים) שבו, כל אחד עם התשובה שנבחרה מבנק התשובות והציון שלה. */
/* פירוט הקריטריונים בנושא — שם הקריטריון, התשובה שנבחרה וציונה */
function topicCrits(dim,ti,getter){
  const t=(dim==='gph'?DATA.gph:DATA[dim])[ti];
  const out=[];
  t.crits.forEach((c,ci)=>{
    if(c.w==null)return;                       // סעיף שאינו משוקלל בציון
    const cell=getter(ti,ci); if(!cell||cell.opt==null)return;
    const o=critOpt(c,cell.opt); if(!o)return;
    out.push({ci,t:c.t,optK:o.k,optText:o.t,score:o.s});
  });
  return out;
}
function scanKS(){
  const out=[];
  // רמת החטיבה
  DATA.gph.forEach((t,ti)=>{ if(!t.scored||isTopicNA('gph','gph',ti))return;
    const sc=topicScore(t,(ci)=>gphCell(ti,ci)); if(sc==null)return;
    const cls=ksAuto(sc); if(!cls)return;
    out.push({scope:'gph',dim:'gph',ti,name:t.name,area:'רמת החטיבה (גפ"ה)',score:sc,cls,
      crits:topicCrits('gph',ti,gphCell)});
  });
  // רמת המסגרות × ממדים
  S.frameworks.forEach(f=>{
    FW_DIMS.forEach(dim=>{
      DATA[dim].forEach((t,ti)=>{ if(!t.scored||isTopicNA(f.id,dim,ti))return;
        const sc=topicScore(t,(ci)=>fwCell(f.id,dim,ti,ci)); if(sc==null)return;
        const cls=ksAuto(sc); if(!cls)return;
        out.push({scope:f.id,dim,ti,name:t.name,area:(f.label||'מסגרת')+' · '+DIM_META[dim].short,
          score:sc,cls,crits:topicCrits(dim,ti,(a,b)=>fwCell(f.id,dim,a,b))});
      });
    });
  });
  return out;
}

/* ====== ריכוז שיפור/שימור אוטומטי לדו"ח ======
   מקור יחיד לאמת: הציון הסופי של כל נושא (topicScore).
     ציון <  KS_THRESHOLD  =>  שיפור
     ציון >= KS_THRESHOLD  =>  שימור
   נושא נכלל אך ורק אם יש לו ציון מחושב — נושא איכותי (scored=false),
   נושא שסומן "לא רלוונטי", או נושא שטרם דורג, אינם מופיעים באף רשימה. */
function ksBuckets(){
  const all=scanKS();
  const bySide=cls=>all.filter(x=>x.cls===cls).sort((a,b)=>a.score-b.score||a.name.localeCompare(b.name,'he'));
  return {improve:bySide('improve'), keep:bySide('keep')};
}
function ksEntryHTML(x){
  const b=band(x.score);
  const crits=x.crits||[];
  return `<div class="ks-entry">
    <div class="kh"><b>${esc(x.name)}</b><span class="area">${esc(x.area)}</span>
      <span class="sc ${b.k?'bg-'+b.k:''}">${Math.round(x.score)}</span></div>
    ${crits.length?`<div class="ks-crits">${crits.map(c=>{
      const cb=c.score==null?'':band(c.score).k;
      return `<div class="ks-crit">
        <span class="cscore ${cb?'bg-'+cb:''}">${c.score==null?'—':c.score}</span>
        <span class="ctxt"><b>${esc(c.t)}</b><span class="cans">${esc(c.optText)}</span></span>
      </div>`;}).join('')}</div>`:''}
  </div>`;
}
function ksColHTML(cls,items){
  const title = cls==='keep' ? 'שימור' : 'שיפור';
  const rule  = cls==='keep' ? `ציון ${KS_THRESHOLD} ומעלה` : `ציון נמוך מ-${KS_THRESHOLD}`;
  const ic    = cls==='keep' ? '<path d="M20 6L9 17l-5-5"/>' : '<path d="M12 20V10M6 20V4M18 20v-7"/>';
  return `<div class="ks-col ${cls}">
    <h4>${svg(ic)}${title}<span class="cnt">${items.length}</span></h4>
    ${items.length ? items.map(ksEntryHTML).join('')
                   : `<p class="ks-empty">אין נושאים ב${rule}.</p>`}
  </div>`;
}
/* הבלוק המלא — משמש גם במחולל הדוחות וגם בדו"ח המופק */
function ksReportHTML(){
  const bk=ksBuckets();
  if(!bk.improve.length && !bk.keep.length)
    return '<p class="ks-empty">טרם נבחרו אפשרויות — ריכוז השיפור/שימור ייבנה אוטומטית עם בחירת האפשרויות.</p>';
  return `<div class="ks-report">${ksColHTML('improve',bk.improve)}${ksColHTML('keep',bk.keep)}</div>`;
}
function scanKSByCategory(){
  const out=[];
  // רמת החטיבה נחשבת קטגוריה אחת
  const gAvg=dimTopicAvg('gph','gph',gphCell);
  if(gAvg!=null) out.push({area:'רמת החטיבה (גפ"ה)',dimLabel:'גפ"ה',avg:gAvg,cls:ksAuto(gAvg)});
  S.frameworks.forEach(f=>{
    FW_DIMS.forEach(dim=>{
      const avg=dimTopicAvg(f.id,dim,(a,b)=>fwCell(f.id,dim,a,b));
      if(avg==null)return;
      out.push({area:(f.label||'מסגרת'),dimLabel:DIM_META[dim].label,avg,cls:ksAuto(avg)});
    });
  });
  return out;
}

/* הנחיות לטיפול מיידי — מתוך הממצאים החלשים, מתועדפות */
function genDirectives(){
  const items=scanFindings().filter(x=>x.score!=null&&x.score<=69);
  items.sort((a,b)=>a.score-b.score);
  return items.map(x=>{
    const kb=kbOf(x.dim,x.name);
    const tag=x.score<60?'טיפול מיידי':'לטיפול';
    const fnd=x.find?` נמצא: ${x.find}.`:'';
    const ref=kb.ref?` (נוהל ${kb.ref})`:'';
    return `[${tag}] ${x.name} — ${x.scope} (ציון ${Math.round(x.score)}):${fnd} נדרש ${kb.fix}${ref}.`;
  });
}

/* סקירת מגמות — שימור / שיפור / המלצות, מתוך המאפיינים החוזרים */
function genTrends(){
  const p=detectPatterns();
  const keep=p.keep.length
    ? p.keep.map(x=>`• ${x.name} — נשמר ברמה גבוהה (ממוצע ${x.avg}) ב-${x.fw} מסגרות.`).join('\n') : '';
  const improve=p.improve.length
    ? p.improve.map(x=>`• ${x.name} — חוזר כפער ב-${x.fw} מסגרות (ממוצע ${x.avg}).`).join('\n') : '';
  const recs=p.improve.map(x=>{
    const parts=x.name.split(' · '); const name=parts[0]; const dim=SHORT2DIM[parts[1]]||'prog';
    const kb=kbOf(dim,name);
    return `• ${name}: ${kb.fix}${kb.ref?` (נוהל ${kb.ref})`:''}.`;
  }).join('\n');
  return {keep,improve,recs};
}

/* הערכה מסכמת — תמונת המצב הכוללת לפי הציונים והממדים */
function genSummary(){
  const ov=overallScore(); if(ov==null) return '';
  const ob=band(ov), gs=gphScore(), nf=S.frameworks.length;
  const ds=FW_DIMS.map(d=>({d,s:dimAvgAcrossFw(d),label:DIM_META[d].label})).filter(x=>x.s!=null);
  ds.sort((a,b)=>b.s-a.s);
  const fwWord=nf===1?'מסגרת אחת שנבדקה':nf+' מסגרות שנבדקו';
  let t=`ביקורת ההדרכה${S.meta.unit?' ביחידת '+S.meta.unit:''} העלתה ציון מסכם משוקלל של ${Math.round(ov)}/100 (${ob.t}), על בסיס ${fwWord}`;
  if(gs!=null) t+=` ורמת חטיבה (גפ"ה) שעמדה על ${Math.round(gs)}`;
  t+='. ';
  if(ds.length>=2){
    const best=ds[0], worst=ds[ds.length-1];
    if(Math.round(best.s)!==Math.round(worst.s))
      t+=`הממד החזק ביותר הוא ${best.label} (${Math.round(best.s)}), ואילו ${worst.label} (${Math.round(worst.s)}) מציב את האתגר המרכזי הדורש חיזוק. `;
  }
  t+=({
    good:'תמונת המצב הכוללת טובה ומשקפת עמידה רחבה בנהלי תקן "יסודות מנצחים"; הדגש הוא על שימור ההישגים והשלמת פערים נקודתיים.',
    mid:'תמונת המצב הכוללת סבירה ומשקפת עמידה חלקית בתקן; נדרש מאמץ ממוקד לסגירת הפערים שזוהו ולהעלאת האחידות בין המסגרות.',
    low:'תמונת המצב מצביעה על פערים מהותיים מול נהלי התקן, הדורשים תכנית התערבות מסודרת בליווי הדרג הממונה.'
  }[ob.k]||'');
  return t;
}

/* התייחסות כללית — מבט רוחבי: שונות בין מסגרות, סביבה וניהול ידע */
function genCrossCut(){
  const ov=overallScore(); if(ov==null) return '';
  let t='';
  const fs=S.frameworks.map(f=>fwScore(f.id)).filter(v=>v!=null);
  if(fs.length>=2){
    const spread=Math.round(Math.max.apply(null,fs)-Math.min.apply(null,fs));
    t += spread>=15
      ? `ניכרת שונות בין המסגרות (פער של כ-${spread} נק' בין הגבוהה לנמוכה), המעידה על יישום לא-אחיד של נהלי התקן ועל הזדמנות להאחדה ולהפצת שיטות עבודה טובות בין המסגרות. `
      : `רמת היישום בין המסגרות אחידה יחסית, המעידה על שגרת עבודה הדרכתית מבוססת ומשותפת. `;
  }
  t+='מומלץ לעגן את ממצאי הביקורת בתכנית עבודה מתעדכנת — עם אחראים ולוחות זמנים — ולשוב ולבחון את סגירת הפערים בבקרה הפנימית הבאה.';
  return t;
}

/* ----- חיווט לממשק ----- */
function confirmRepl(cur,msg){ return !(cur&&cur.trim())||confirm(msg||'קיים תוכן בשדה. להחליפו בטיוטה המחוללת?'); }
function genOne(which){
  if(which==='summary'){ const v=genSummary(); if(!v){toast('יש לבחור אפשרויות במסגרות לפני הניסוח');return;} if(!confirmRepl(S.report.summary))return; S.report.summary=v; }
  else if(which==='crossCut'){ const v=genCrossCut(); if(!v){toast('יש להזין ציונים במסגרות לפני הניסוח');return;} if(!confirmRepl(S.report.crossCut))return; S.report.crossCut=v; }
  else if(which==='directives'){ const lines=genDirectives(); if(!lines.length){toast('לא זוהו נושאים בציון נמוך הדורשים טיפול');return;}
    if(S.report.directives.some(d=>d.trim())&&!confirm('קיימות הנחיות שהוזנו. להחליפן בטיוטה המחוללת?'))return; S.report.directives=lines; }
  else if(which==='trends'){ const tr=genTrends(); if(!tr.keep&&!tr.improve){toast('טרם זוהו מגמות חוזרות (נדרשות שתי מסגרות ומעלה)');return;}
    if((S.report.trendsKeep+S.report.trendsImprove+S.report.recommendations).trim()&&!confirm('קיים תוכן בסקירת המגמות. להחליפו בטיוטה המחוללת?'))return;
    S.report.trendsKeep=tr.keep; S.report.trendsImprove=tr.improve; S.report.recommendations=tr.recs; }
  save(); render(); toast('נוסחה טיוטה — ניתנת לעריכה חופשית');
}
function genAll(){
  if(overallScore()==null){ toast('יש להזין ציונים במסגרות לפני הניסוח'); return; }
  const has=(S.report.summary+S.report.crossCut+S.report.trendsKeep+S.report.trendsImprove+S.report.recommendations).trim()||S.report.directives.some(d=>d.trim());
  if(has&&!confirm('לחולל טיוטות חדשות לכל הסעיפים? תוכן קיים בסעיפים אלו יוחלף.'))return;
  S.report.summary=genSummary();
  const dl=genDirectives(); if(dl.length) S.report.directives=dl;
  const tr=genTrends(); S.report.trendsKeep=tr.keep; S.report.trendsImprove=tr.improve; S.report.recommendations=tr.recs;
  save(); render(); toast('נוסחו טיוטות לכל הסעיפים — ניתנות לעריכה');
}
