  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

v style=\"width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#C9A879\"><\u002Fdiv>תוך 10 ימים<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#7A7972\"><div style=\"width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#9B8FC4\"><\u002Fdiv>שבוע שלישי<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#7A7972\"><div style=\"width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#9A998F\"><\u002Fdiv>פעם אחת<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"text-align:center;padding:1.2rem;font-size:11px;color:#b9b8b1;letter-spacing:.04em\">לשימוש פנימי בלבד · לחץ על משימה לפרטים נוספים<\u002Fdiv>\n\n  <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ onOverlayClick }}\" style=\"position:fixed;inset:0;background:rgba(45,45,65,0.42);z-index:200;display:flex;align-items:flex-end;justify-content:center\">\n    <div sc-camel-on-click=\"{{ stop }}\" dir=\"rtl\" style=\"background:#FFFFFF;border-radius:22px 22px 0 0;width:100%;max-width:600px;padding:1.8rem 1.8rem 2.5rem;max-height:88vh;overflow-y:auto;font-family:'Heebo',sans-serif\">\n      <div style=\"width:36px;height:4px;background:rgba(40,40,60,0.08);border-radius:2px;margin:0 auto 1.2rem\"><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:1.2rem\">\n        <div style=\"width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background: {{ modal.chipBg }}\">{{ modal.icon }}<\u002Fdiv>\n        <div>\n          <div style=\"font-size:19px;font-weight:900;margin-bottom:3px\">{{ modal.name }}<\u002Fdiv>\n          <div style=\"font-size:13px;color:#7A7972\"><span style=\"display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;background: {{ modal.badgeBg }};color: {{ modal.badgeColor }}\">{{ modal.badgeText }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:1px;background:rgba(40,40,60,0.08);margin:1rem 0\"><\u002Fdiv>\n      <div style=\"margin-bottom:1rem\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:.1em;color:#7A7972;margin-bottom:.5rem\">מה זה?<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.75;color:#2A2A28\">{{ modal.desc }}<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ modal.hasSubtopics }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-bottom:1rem\">\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:.1em;color:#7A7972;margin-bottom:.5rem\">תתי נושאים<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:.3rem\">\n            <sc-for list=\"{{ modal.subtopics }}\" as=\"s\" hint-placeholder-count=\"2\">\n              <div style=\"background:#EFEEE9;border-radius:12px;padding:12px 14px;border-right-width:3px;border-right-style:solid;border-right-color: {{ s.color }}\">\n                <div style=\"font-size:14px;font-weight:800;margin-bottom:3px;color:#3a3a40\">{{ s.name }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;line-height:1.65;color:#7A7972\">{{ s.desc }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"margin-bottom:1rem\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:.1em;color:#7A7972;margin-bottom:.5rem\">מתי לבצע?<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:.5rem\">\n          <sc-for list=\"{{ modal.weeks }}\" as=\"w\" hint-placeholder-count=\"2\">\n            <span style=\"padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;background: {{ w.bg }};color: {{ w.color }}\">{{ w.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ modal.whenNote }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:13px;color:#7A7972;margin-top:.6rem;line-height:1.6\">{{ modal.whenNote }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ modal.source }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-bottom:1rem;margin-top:.5rem\">\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:.1em;color:#7A7972;margin-bottom:.5rem\">מקור<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.75;color:#7A7972\">{{ modal.source }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ closeModal }}\" style=\"margin-top:1.5rem;width:100%;padding:13px;border-radius:12px;border:1px solid rgba(40,40,60,0.08);background:#F6F5F2;color:#2A2A28;font-family:'Heebo',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s\" style-hover=\"background:#EFEEE9\">סגור<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showCover&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;התנהגות&quot;}}\">\nconst ONCE = {badgeBg:'#EDEBE5',badgeColor:'#57564D',dotColor:'#9A998F',chipBg:'#EDEBE5',chipColor:'#57564D'};\nconst WEEKLY = {badgeBg:'#E6F1EB',badgeColor:'#3D6B54',dotColor:'#78B49B',chipBg:'#E6F1EB',chipColor:'#3D6B54'};\nconst MONTHLY = {badgeBg:'#E7EFF8',badgeColor:'#3B5D85',dotColor:'#7FA0C9',chipBg:'#E7EFF8',chipColor:'#3B5D85'};\nconst TENDAYS = {badgeBg:'#F5EDDF',badgeColor:'#8A6A3C',dotColor:'#C9A879',chipBg:'#F5EDDF',chipColor:'#8A6A3C'};\nconst THIRDWEEK = {badgeBg:'#EDEAF5',badgeColor:'#5C5091',dotColor:'#9B8FC4',chipBg:'#EDEAF5',chipColor:'#5C5091'};\n\nconst AT = {name:'א.ת שבועיים קדימה',icon:'📊',...WEEKLY,badgeText:'🗓 כל שבוע',when:['כל שבוע'],source:'נוהל 1.2 – שעון פעילות ביחידת הדרכה'};\nconst SIKUM = {name:'סיכומי שבוע',icon:'📋',...WEEKLY,badgeText:'🗓 כל שבוע',when:['כל שבוע'],source:'נוהל 1.6 – סיכומים עיתיים במהלך ההכשרה'};\nconst STATUS = {name:'סטטוס חניך מתקשה',icon:'📈',...MONTHLY,badgeText:'📆 פעם בחודש',when:['פעם בחודש'],source:'נוהל 4.1 – טיפול בחניך מתקשה'};\nconst HANICHA = {name:'מופע חניכה לסגל',icon:'👁',...TENDAYS,badgeText:'⚡ תוך 10 ימים',source:'נוהל 3.4 – פיתוח והערכת מפקדים'};\n\nconst PHASES = [\n  {\n    id:'before',title:'לפני הכנ\"ס',icon:'📋',color:'#8A93A8',bgLight:'#ECEEF3',\n    desc:'הכנות והיערכות לפני פתיחת מחזור ההכשרה',\n    tasks:[\n      {name:'מעבר על תיק יסוד ההכשרה',icon:'📁',...ONCE,badgeText:'⏱ פעם אחת',\n       when:['חודש לפני פתיחת הכנ\"ס'],\n       desc:'מעבר מקיף על כשירויות, לו\"ז, עץ הערכה לקראת בניית מחזור ההכשרה הקרוב, בדגש על עץ הערכה שהוא כלי המשקף את רמת כשירות החניך בכל אחד ממרכיבי תפקידיו בסוף ההכשרה ומהווה תנאי סף להסמכה.',\n       source:'נוהל 1.5 – היערכות לפתיחת מחזור'},\n      {name:'אישור תוכניות להכשרה',icon:'✅',...ONCE,badgeText:'⏱ פעם אחת',\n       when:['שבועיים עד שבוע לפני הכנ\"ס'],\n       desc:'לאחר ניתוח תיק היסוד של ההכשרה, מעבר על הפקות לקחים מהמחזור הקודם ולבסוף בניית הגרף למחזור הקרוב, נדרש לקיים מופע אישור תוכניות למחזור המגלם את תכנון ההכשרה המלא למחזור הקרוב, בביצוע אישור התוכניות נקפיד להציג את: מאפייני המחזור הנוכחי (חגים, מועדים וגורמים משפיעים שונים), חריגויות מתו התקן - תיק היסוד (במידה ואין נציין שאין), יישום הפקות הלקחים ממחזור קודם ויישום הנחיות רמ\"מ וכמובן להציף פערים במידה וישנם.\\n'},\n      {name:'פתיחת סביבת ההכשרה בקמפוס הדיגיטלי',icon:'💻',...ONCE,badgeText:'⏱ פעם אחת',\n       when:['שבוע לפני הכנ\"ס'],\n       desc:'בכדי שהסגל יוכל לעבוד באמצעות הקמפוס, נדרש לבנות/להעתיק סביבת הכשרה וסגל בקמפוס ולדאוג שכלל הפריטים הרלוונטיים נמצאים שם.'}\n    ]\n  },\n  {\n    id:'kenes',title:'הכנ\"ס',icon:'🚀',color:'#7FA0C9',bgLight:'#E9F0F8',\n    desc:'שבוע פתיחת המחזור והכנת הסגל',\n    tasks:[\n      {name:'בניית תוכנית חניכה לסגל',icon:'📝',...ONCE,badgeText:'⏱ שבוע לפתיחה',\n       when:['שבוע לפני פתיחת הכנ\"ס'],\n       desc:'גיבוש תוכנית חניכה מותאמת לכלל אנשי הסגל של הפלוגה לקראת מחזור ההכשרה. התוכנית כוללת הגדרת יעדים ברורים לכל איש סגל, כלי ההערכה שישמשו במהלך המחזור, מועדי מופעי החניכה (תצפיות) ומנגנוני המשוב. התוכנית מוצגת לאיש הסגל בשבוע הראשון של הכנת הסגל.',\n       source:'נוהל 3.4 – פיתוח והערכת מפקדים'},\n      {name:'בקרה על ביצוע הכנת הסגל ע\"פ 4 המימדים המחייבים',icon:'🎯',...ONCE,badgeText:'🎯 בהכנ\"ס',\n       when:['בהכנ\"ס'],\n       desc:'בהכנת הסגל ישנם 4 צירים מחייבים: ציר ההדרכה,ציר הפיקוד, ציר המקצוע ועבודת הסגל — על המ\"פ לפקד, לנהל ולהיות בבקרה במהלך הכנת הסגל ולוודא מימוש תוכנית הכנת הסגל המגולמות בתיק היסוד לאחר הפקת הלקחים.\\n',\n       subtopics:[\n         {name:'ציר מקצועי',desc:'מעבר על התכנים הנגזרים ממרכיבי התפקיד של בעל התפקיד אותו מכשירים: העמקה בחומר המקצועי ולימוד מערכי השיעור על מנת לוודא יישור קו בין הסגל, מעבר על תכני טירונות 02, תכני הדרכה ובמידת הצורך תכני קמ\"ד מקצועי בחלוקה למגמות, ביצוע בפועל של תרגילים נדרשים בקורס (\\'כשיר להכשיר\\').'},\n         {name:'ציר פיקודי',desc:'תפיסת תפקיד פיקוד של אנשי הסגל והגדרת יחסי סגל - חניך: שיח על תפיסות תפקיד הפיקוד של כל איש סגל, מעבר על המענה לפרט בהכשרה,  שיח על התנהלות שוטפת  ומעבר על כללי אחריות וסמכות. (יכול לקרות גם במסגרת סדנת היעדים שלרוב תכלול את ציר עבודת הסגל, רצוי לשלב מתודות העוסקות בשיח פיקודי כמו סימולציות, הרצאות פיקודיות וכו)'},\n         {name:'ציר הדרכתי',desc:'התפיסות והמיומנויות ההדרכתיות הנדרשות להעברת התכנים בקורס: חידוד מיומנויות ההדרכה הבסיסיות, ביצוע סדנת חניכה ושיח על תהליכי החניכה הנדרשים לכל אורך ההכשרה, מעבר על מופעי הערכה המתבצעים לאורך ההכשרה (הפרט וההכשרה) וביצוע היערכות הדרכתית נדרשת (הכנת כיתות ההדרכה, עזרים כמו הוצל\"א נדרש וכו)'},\n         {name:'עבודת הסגל',desc:'הנורמות והנהלים לעבודת הסגל במהלך הקורס: לרוב מתבצע בשלבים הראשונים של הכנת סגל במסגרת סדנת יעדים, סדנת היעדים יכולה להתחלק בהתאם לדרג מסויים (סדנת פורום מוביל מ\"פ - מ\"מ - מפל\"ג וסדנה של המ\"מ יחד עם המ\"כיות - בהתאם להחלטה ולתרבות המסגרת). במסגרת עבודת הסגל יתבצע היכרות הסגל, תיאום ציפיות, מעבר על נהלי הפלוגה וההכשרה, מעבר על הגדרות התפקידים, מעבר פעילויות המחזקות עבודה בצוות, שיח בנוגע לנורמות עבודה וניהול שגרת הפלוגה, מעבר על תוכנית החניכה התוך סגלית.\\n'}\n       ]},\n      {name:'סיכום ההכנ\"ס',icon:'🗒️',...ONCE,badgeText:'🏁 סוף ההכנ\"ס',\n       when:['סוף ההכנ\"ס'],\n       desc:\"סיכומים והפקת לקחים מביצוע הכנת הסגל. ייעשה באמצעות שאלונים דיגיטליים / שיח פתוח, לקחים אישיים, ביצוע מול תכנון ועמידה בכשירויות הנדרשות ב'כשיר להכשיר'.\"}\n    ]\n  },\n  {\n    id:'start',title:'תחילת הכשרה',icon:'📅',color:'#78B49B',bgLight:'#E8F2ED',\n    desc:'שלב פתיחת ההכשרה',\n    tasks:[\n      {...AT,desc:'הכנת אומדן תקדים (א.ת) לשבועיים הקרובים של ההכשרה. מטרת הא.ת היא לאפשר למ\"פ לתכנן מראש את פעילות הפלוגה, לאתר אילוצים צפויים ולוודא שכל הסגל ערוך לביצוע התכנית. הא.ת כולל את לוח הזמנים של כל הפעילויות, הכשירויות המתוכננות ואבני הדרך הצפויות.'},\n      {...SIKUM,desc:'סיכום שבועי ברמת הפלוגה, בראשות המ\"פ, עם השתתפות מ\"מים ומ\"כים. הסיכום עוסק ב: תכנון מול ביצוע, לקחים מהשבוע החולף, דגשים להמשך, טיפול באירועים חריגים, חלוקת עבודה בין אנשי הסגל ומשמעויות לוגיסטיות. הסיכום מתקיים בסוף כל שבוע ומהווה כלי מרכזי לניהול ההכשרה.'},\n      {...HANICHA,when:['סוף הטירונות'],\n       desc:'תצפית סדורה שמבצע המפקד הממונה (מג\"ד או מקבילו) על איש הסגל במופע פורמלי שמוביל — הובלת תרגיל, מסדר, תדריך, שיעור וכדומה. לאחר התצפית נדרש המ\"פ לבצע מופע חניכה תוך 10 ימים, במסגרתו הוא משקף לאיש הסגל את הציון וההערכות. מופע חניכה אחד לפחות יהיה \"חניכה על חניכה\" — משוב על אופן החניכה של חייליו.'},\n      {name:'איתור חניכים מתקשים',icon:'🔍',...THIRDWEEK,badgeText:'📌 שבוע 3-2',\n       when:['שבוע 2–3 (סוף שבועיים ראשונים)'],\n       desc:'עד תום השבועיים הראשונים להכשרה, על המ\"פ לגבש רשימה ראשונית של חניכים שעשויים להתקשות — על בסיס אבחונים, מבחני רמה, שיחות אישיות, רקע אישי והתרשמות המפקדים. הרשימה היא דינאמית ומתעדכנת לאורך כל ההכשרה. לכל חניך מתקשה תבנה תוכנית אישית לקידומו (צפ\"א).',\n       source:'נוהל 4.1 – טיפול בחניך מתקשה'},\n      {...STATUS,desc:'אחת לתקופה מקיים המ\"פ דיון סטטוס על החניכים המתקשים. בדיון מוצג סטטוס ההתקדמות של כל חניך, ומתקבלות החלטות לגבי דרכי הפעולה הבאות. אם החניך הדביק את הפער — ניתן להורידו מהרשימה. אם לא עמד ביעדים לאורך זמן — מועלה לוועדת התאמה בראשות המג\"ד.'}\n    ]\n  },\n  {\n    id:'mid',title:'אמצע הכשרה',icon:'⚙️',color:'#C9A879',bgLight:'#F5EEE1',\n    desc:'המשך, מעקב וחוות דעת ביניים',\n    tasks:[\n      {...AT,desc:'הכנת אומדן תקדים (א.ת) לשבועיים הקרובים של ההכשרה. מטרת הא.ת היא לאפשר למ\"פ לתכנן מראש את פעילות הפלוגה, לאתר אילוצים צפויים ולוודא שכל הסגל ערוך לביצוע התכנית.'},\n      {...SIKUM,desc:'סיכום שבועי ברמת הפלוגה בראשות המ\"פ. עוסק בתכנון מול ביצוע, לקחים מהשבוע, דגשים להמשך, אירועים חריגים וחלוקת עבודה בין הסגל.'},\n      {...HANICHA,when:['סוף קמ\"ד בסיסי'],\n       desc:'תצפית סדורה על איש הסגל במופע פורמלי. לאחר התצפית נדרש המ\"פ לבצע מופע חניכה תוך 10 ימים — שיקוף הציון וההערכות לאיש הסגל.'},\n      {...STATUS,desc:'דיון בסטטוס החניכים המתקשים, בראשות המ\"פ. מוצגת התקדמות כל חניך ומתקבלות החלטות לגבי דרכי הפעולה הבאות.'},\n      {name:'חוו\"ד אמצע חניכים וסגל',icon:'💬',...ONCE,badgeText:'🔶 אמצע המחזור',\n       when:['אמצע המחזור'],\n       desc:'מעבר על תוכנית החניכה, שיח על יעדים, על הנקודות שעלו ועל תהליך החניכה עד כה, ובמידת הצורך עדכון התוכנית להמשך.'},\n      {name:'מופעי ההערכה אמצע',icon:'🧭',...ONCE,badgeText:'🔶 אמצע המחזור',\n       when:['אמצע המחזור'],\n       desc:'ביצוע תהליכי הערכה אמצע הכשרה ב 2 תחומים\\n',\n       subtopics:[\n         {name:'הערכת הכשרה',desc:'הערכה כוללת של תהליך ההכשרה עד אמצע המחזור - עמידה ביעדים, איכות ההדרכה, אפקטיביות שגרות העבודה והתאמת התכנון לביצוע בפועל, לצורך תיקון והכוונה להמשך. ייעשה באמצעות שימוש בשאלונים דיגיטליים, סיכומי יום / שבוע עם חניכי ההכשרה, ביצוע תחקירי לימוד נושאיים, שיחת חתך אמצע וכו..'},\n         {name:'הערכת פרט',desc:'הערכה כוללת של כל חניך וחניך בהכשרה (הערכת הפרט) , ייעשה באמצעות שימוש בסוציומטרי, ביצוע סטטוס הסמכות אמצע (ועדות הסמכה), סטטוס חניכים מתקשים אמצע ועדות הערכה אמצע.\\n'}\n       ]}\n    ]\n  },\n  {\n    id:'end',title:'סוף הכשרה',icon:'🏁',color:'#9B8FC4',bgLight:'#EFECF6',\n    desc:'שלב הסיום, ההערכה וההסמכה',\n    tasks:[\n      {...AT,desc:'הכנת אומדן תקדים (א.ת) לשבועיים הקרובים של ההכשרה.'},\n      {...SIKUM,desc:'סיכום שבועי ברמת הפלוגה בראשות המ\"פ. עוסק בתכנון מול ביצוע, לקחים מהשבוע, דגשים להמשך ואירועים חריגים.'},\n      {...HANICHA,when:['סוף קמ\"ד מקצועי'],\n       desc:'תצפית סדורה על איש הסגל במופע פורמלי. לאחר התצפית נדרש המ\"פ לבצע מופע חניכה תוך 10 ימים.'},\n      {...STATUS,desc:'דיון בסטטוס החניכים המתקשים, בראשות המ\"פ.'},\n      {name:'הערכת מופעי הערכה סוף',icon:'📊',...ONCE,badgeText:'🏁 סוף המחזור',\n       when:['סוף המחזור'],\n       desc:'ביצוע תהליכי הערכה סוף ב 2 תחומים\\n',\n       subtopics:[\n         {name:'הערכת ההכשרה',desc:'הערכה כוללת של תהליך ההכשרה בסוף ההכשרה על מנת להפיק לקחים להשתפר במחזור הבא - וידוא עמידה ביעדים, איכות ההדרכה, אפקטיביות שגרות העבודה והתאמת התכנון לביצוע בפועל, ייעשה באמצעות שימוש בשאלונים דיגיטליים, סיכומי יום / שבוע עם חניכי ההכשרה, ביצוע תחקירי סוף לימוד נושאי.'},\n         {name:'הערכת פרט',desc:'הערכת הפרט ע\"י החלטה בנוגע להסמכה (זכרו כי חל איסור להסמיך על תנאי) - מעבר על עץ הערכה בהתאם לציוני החניכים בהכשרה, ביצוע ועדות הסמכות סוף ובקרה על כך שכלל העוברים את הסף מוכשרים ומי שלא יועמד בועדת הערכה סוף.\\n'}\n       ]},\n      {name:'העברות מקל חניכים',icon:'🤝',...ONCE,badgeText:'🏁 סוף המחזור',\n       when:['סוף ההכשרה'],\n       desc:'תהליך מסודר להעברת המקל של החניכות למדורי ההכשרה השונים במסגרות הבה\"ד: העברת המקל צריכה לכלול את כלל הפריטים הנמצאים בתיק החניך - סיכום ראיון קליטה, מעקבים, נתונים כמו ת\"ש קב\"ן וכו.., הישגים במהלך ההכשרה (מבחנים עיוניים ומעשיים), מופעי החניכה שבוצעו במהלך ההכשרה בכדי להעביר תמונת מצב אישית של כל חניכה ולהבטיח את המשך התהליך גם בתפקידן במדורים. '},\n      {name:'מופע סיכום הכשרה',icon:'🎯',...ONCE,badgeText:'🏁 לאחר המחזור',\n       when:['שבועיים מסיום ההכשרה'],\n       desc:'לאחר סיום ההכשרה נדרש לאגד את כלל התחומים לכדי סיכום אחיד העוסק ב: תכנון מול ביצוע, הפקות לקחים לאורך ההכשרה והמלצות למחזור הבא, הצגת מוקדי תחקיר בנושאים ספיצפים שעלו לאורך ההכשרה, סיכום הסגל, סטטוס עמידה בכשירויות נדרשות וזאת על מנת שאפשר יהיה לשמר את הידע ולהבטיח שיפור להכשרה הבאה. '}\n    ]\n  }\n];\n\nclass Component extends DCLogic {\n  state = { current: 0, cover: true, modal: null };\n\n  renderVals() {\n    const cur = this.state.current;\n    const phase = PHASES[cur];\n    const showCover = (this.props.showCover ?? true) && this.state.cover;\n    const pct = cur / (PHASES.length - 1);\n\n    const tlPhases = PHASES.map((p, i) => {\n      const done = i < cur, active = i === cur;\n      return {\n        title: p.title,\n        glyph: done ? '✓' : p.icon,\n        nodeBg: (done || active) ? p.color : '#FFFFFF',\n        nodeBorder: (done || active) ? p.color : '#e2e1db',\n        nodeColor: (done || active) ? '#fff' : 'inherit',\n        nodeFontSize: done ? '13px' : '16px',\n        nodeTransform: active ? 'scale(1.2)' : 'none',\n        nodeShadow: active ? '0 0 0 4px ' + p.color + '33' : 'none',\n        labelColor: (done || active) ? p.color : '#b3b2ac',\n        onClick: () => this.setState({ current: i })\n      };\n    });\n\n    const tasks = phase.tasks.map((t, ti) => ({\n      name: t.name, dotColor: t.dotColor,\n      badgeBg: t.badgeBg, badgeColor: t.badgeColor, badgeText: t.badgeText,\n      weekStr: 'עיתוי: ' + t.when.join(' · '),\n      subFlag: t.subtopics && t.subtopics.length ? 'כולל ' + t.subtopics.length + ' תתי נושאים' : false,\n      onClick: () => this.setState({ modal: { p: cur, t: ti } })\n    }));\n\n    let modal = null;\n    if (this.state.modal) {\n      const p = PHASES[this.state.modal.p];\n      const t = p.tasks[this.state.modal.t];\n      modal = {\n        name: t.name, icon: t.icon, desc: t.desc, chipBg: t.chipBg,\n        badgeBg: t.badgeBg, badgeColor: t.badgeColor, badgeText: t.badgeText,\n        whenNote: t.whenNote || false, source: t.source || false,\n        hasSubtopics: !!(t.subtopics && t.subtopics.length),\n        subtopics: (t.subtopics || []).map(s => ({ name: s.name, desc: s.desc, color: p.color })),\n        weeks: t.when.map(w => ({ label: w, bg: t.chipBg, color: t.chipColor }))\n      };\n    }\n\n    return {\n      showCover, phase, tlPhases, tasks, modal,\n      modalOpen: !!modal,\n      fillWidth: 'calc((100% - 40px) * ' + pct + ')',\n      fillGradient: 'linear-gradient(to left,' + phase.color + ',' + PHASES[0].color + ')',\n      spineGradient: 'linear-gradient(to bottom,' + phase.color + ',' + phase.bgLight + ')',\n      counterText: 'שלב ' + (cur + 1) + ' מתוך ' + PHASES.length,\n      hasPrev: cur > 0, hasNext: cur < PHASES.length - 1,\n      prevTitle: cur > 0 ? PHASES[cur - 1].title : '',\n      nextTitle: cur < PHASES.length - 1 ? PHASES[cur + 1].title : '',\n      nextColor: cur < PHASES.length - 1 ? PHASES[cur + 1].color : '#9B8FC4',\n      enterApp: () => this.setState({ cover: false }),\n      goHome: () => this.setState({ cover: true, current: 0 }),\n      goPrev: () => this.setState({ current: cur - 1 }),\n      goNext: () => this.setState({ current: cur + 1 }),\n      closeModal: () => this.setState({ modal: null }),\n      onOverlayClick: () => this.setState({ modal: null }),\n      stop: (e) => e.stopPropagation()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
