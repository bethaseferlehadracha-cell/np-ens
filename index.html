<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משימות מ"פ קמ"ד</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F6F5F2;--card:#FFFFFF;--text:#2A2A28;--muted:#7A7972;--border:rgba(40,40,60,0.08);
  --soft:#EFEEE9;
  /* pastel phase palette */
  --c0:#8A93A8;--c1:#7FA0C9;--c2:#78B49B;--c3:#C9A879;--c4:#9B8FC4;
}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ─── COVER ─────────────────────────────────────────── */
#cover{
  position:fixed;inset:0;z-index:100;
  background:
    radial-gradient(1200px 600px at 80% -10%,rgba(155,143,196,0.22),transparent 60%),
    radial-gradient(1000px 500px at 0% 110%,rgba(127,160,201,0.20),transparent 55%),
    linear-gradient(160deg,#F3F2F7 0%,#F1F4F2 55%,#F5F1EC 100%);
  display:flex;align-items:center;justify-content:center;padding:1.5rem;
  transition:opacity .4s ease;
}
.cover-card{
  max-width:560px;width:100%;text-align:center;
  background:rgba(255,255,255,0.72);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.8);border-radius:26px;
  padding:3.2rem 2.4rem 2.8rem;
  box-shadow:0 24px 60px -20px rgba(80,80,120,0.28),0 2px 10px rgba(80,80,120,0.08);
  animation:coverIn .55s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes coverIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.cover-badge{
  display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;
  color:#7A6FA8;background:rgba(155,143,196,0.14);border:1px solid rgba(155,143,196,0.28);
  padding:6px 16px;border-radius:20px;margin-bottom:1.6rem;
}
.cover-emblem{
  width:124px;height:124px;margin:0 auto 1.4rem;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 12px 22px rgba(55,55,75,0.30));
}
.cover-emblem img{width:100%;height:100%;object-fit:contain;display:block}
.cover-card h1{
  font-size:clamp(1.7rem,5.5vw,2.5rem);font-weight:900;letter-spacing:-.02em;
  line-height:1.2;color:#33333A;margin-bottom:.7rem;
}
.cover-card h1 em{color:#2A2A28;font-style:normal}
.cover-sub{font-size:15px;color:#6E6D75;line-height:1.7;max-width:400px;margin:0 auto 2rem}
.cover-btn{
  font-family:'Heebo',sans-serif;font-size:16px;font-weight:800;color:#fff;
  border:none;cursor:pointer;padding:14px 34px;border-radius:14px;
  background:linear-gradient(135deg,#7FA0C9,#9B8FC4);
  box-shadow:0 12px 26px -8px rgba(127,140,200,0.6);
  transition:transform .15s,box-shadow .15s,opacity .15s;
}
.cover-btn:hover{transform:translateY(-2px);box-shadow:0 16px 32px -8px rgba(127,140,200,0.7)}
.cover-foot{margin-top:1.8rem;font-size:11.5px;color:#9c9ba3;letter-spacing:.03em}
body.entered #cover{opacity:0;pointer-events:none}

/* ─── MAIN APP ──────────────────────────────────────── */
#app{display:none}
.header{
  background:linear-gradient(135deg,#5E6B85 0%,#7E7399 100%);
  padding:1.5rem 2rem 1.35rem;
}
.header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.header h1{font-size:clamp(1.2rem,3.3vw,1.75rem);font-weight:900;color:#fff;letter-spacing:-.02em}
.header h1 em{color:#EAD7A6;font-style:normal}
.home-badge{
  background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.28);
  color:#fff;font-size:12.5px;font-weight:700;padding:6px 15px;border-radius:20px;
  cursor:pointer;transition:background .15s;white-space:nowrap;
}
.home-badge:hover{background:rgba(255,255,255,0.24)}

/* TIMELINE */
.tl-outer{max-width:900px;margin:0 auto;padding:2rem 1.5rem 0}
.tl-strip{display:flex;align-items:flex-start;position:relative}
.tl-strip::before{
  content:'';position:absolute;top:20px;right:20px;left:20px;
  height:3px;background:#e2e1db;z-index:0;border-radius:2px;
}
.tl-fill{
  position:absolute;top:20px;right:20px;height:3px;
  background:linear-gradient(to left,var(--fill-end,#9B8FC4),var(--fill-start,#8A93A8));
  z-index:1;border-radius:2px;transition:width .4s cubic-bezier(.4,0,.2,1);
}
.tl-phase{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;z-index:2;cursor:pointer;padding-bottom:.5rem}
.tl-node{
  width:40px;height:40px;border-radius:50%;background:var(--card);
  border:3px solid #e2e1db;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:border-color .2s,transform .2s,background .2s,box-shadow .2s;
}
.tl-phase.done .tl-node{background:var(--phase-color);border-color:var(--phase-color);font-size:13px;color:#fff}
.tl-phase.active .tl-node{
  background:var(--phase-color);border-color:var(--phase-color);transform:scale(1.2);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--phase-color) 20%,transparent);
}
.tl-phase:hover:not(.active) .tl-node{border-color:var(--phase-color);transform:scale(1.08)}
.tl-label{
  margin-top:8px;font-size:10.5px;font-weight:700;text-align:center;
  color:#b3b2ac;line-height:1.3;max-width:74px;transition:color .15s;
}
.tl-phase.active .tl-label,.tl-phase.done .tl-label{color:var(--phase-color)}

/* CONTENT */
.content-wrap{max-width:900px;margin:0 auto;padding:2rem 1.5rem 3rem}
.phase-hero{display:flex;align-items:center;gap:16px;margin-bottom:1.8rem;animation:fadeUp .25s ease both}
.phase-icon-box{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.phase-title{font-size:24px;font-weight:900;letter-spacing:-.02em}
.phase-desc{font-size:13px;color:var(--muted);margin-top:3px}

/* VERTICAL TASK LIST */
.vtl{position:relative;padding-right:28px}
.vtl::before{
  content:'';position:absolute;right:9px;top:8px;bottom:8px;
  width:2px;background:linear-gradient(to bottom,var(--spine-top),var(--spine-bottom));
  border-radius:1px;
}
.vtl-item{
  display:flex;align-items:flex-start;gap:16px;margin-bottom:12px;
  position:relative;animation:fadeUp .22s ease both;cursor:pointer;
}
.vtl-item:nth-child(1){animation-delay:.04s}
.vtl-item:nth-child(2){animation-delay:.08s}
.vtl-item:nth-child(3){animation-delay:.12s}
.vtl-item:nth-child(4){animation-delay:.16s}
.vtl-item:nth-child(5){animation-delay:.20s}
.vtl-item:nth-child(6){animation-delay:.24s}
.vtl-item:nth-child(7){animation-delay:.28s}
.vtl-dot{
  position:absolute;right:-28px;top:14px;width:20px;height:20px;border-radius:50%;
  background:var(--card);border:2.5px solid var(--dot-color,#ccc);
  display:flex;align-items:center;justify-content:center;z-index:1;
}
.vtl-dot::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--dot-color,#ccc)}
.vtl-card{
  flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 1px 4px rgba(60,60,90,0.05);border-right:4px solid var(--dot-color,#eee);
  transition:box-shadow .15s,transform .12s;
}
.vtl-item:hover .vtl-card{box-shadow:0 6px 18px -6px rgba(80,80,120,0.22);transform:translateX(-2px)}
.vtl-left{flex:1;min-width:0}
.vtl-name{font-size:15px;font-weight:700;margin-bottom:3px}
.vtl-week{font-size:12px;color:var(--muted);line-height:1.5}
.vtl-sub-flag{display:inline-block;margin-top:5px;font-size:10.5px;font-weight:700;color:#7A6FA8;background:rgba(155,143,196,0.13);padding:2px 9px;border-radius:12px}
.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.badge-weekly{background:#E6F1EB;color:#3D6B54}
.badge-monthly{background:#E7EFF8;color:#3B5D85}
.badge-10days{background:#F5EDDF;color:#8A6A3C}
.badge-3weekly{background:#EDEAF5;color:#5C5091}
.badge-once{background:#EDEBE5;color:#57564D}
.tap-hint{font-size:11px;color:var(--muted);margin-bottom:1rem;opacity:.7}

/* NAV */
.nav-row{display:flex;gap:10px;margin-top:1.5rem;justify-content:space-between;align-items:center}
.nav-btn{
  padding:10px 22px;border-radius:10px;border:1px solid var(--border);background:var(--card);
  color:var(--text);font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;
  cursor:pointer;transition:all .14s;box-shadow:0 1px 3px rgba(60,60,90,0.06);
}
.nav-btn:hover{background:var(--soft);transform:translateY(-1px)}
.nav-btn.primary{color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px rgba(80,80,120,0.4)}
.nav-btn.primary:hover{opacity:.9;transform:translateY(-1px)}
.step-counter{font-size:13px;color:var(--muted);font-weight:500}

/* LEGEND */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:2rem;padding-top:1.2rem;border-top:1px solid var(--border)}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(45,45,65,0.42);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{
  background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:600px;
  padding:1.8rem 1.8rem 2.5rem;transform:translateY(30px);transition:transform .25s cubic-bezier(.4,0,.2,1);
  max-height:88vh;overflow-y:auto;
}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 1.2rem}
.modal-header{display:flex;align-items:center;gap:12px;margin-bottom:1.2rem}
.modal-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.modal-title{font-size:19px;font-weight:900;margin-bottom:3px}
.modal-freq{font-size:13px;color:var(--muted)}
.modal-divider{height:1px;background:var(--border);margin:1rem 0}
.modal-section{margin-bottom:1rem}
.modal-section-title{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:.5rem}
.modal-body{font-size:14px;line-height:1.75;color:var(--text)}
.modal-weeks{display:flex;flex-wrap:wrap;gap:6px;margin-top:.5rem}
.week-chip{
  padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;
  background:var(--chip-bg,#EDEBE5);color:var(--chip-color,#57564D);
}
.when-note{font-size:13px;color:var(--muted);margin-top:.6rem;line-height:1.6}
/* SUBTOPICS */
.subtopics{display:flex;flex-direction:column;gap:9px;margin-top:.3rem}
.subtopic{
  background:var(--soft);border-radius:12px;padding:12px 14px;
  border-right:3px solid var(--sub-color,#9B8FC4);
}
.subtopic-name{font-size:14px;font-weight:800;margin-bottom:3px;color:#3a3a40}
.subtopic-desc{font-size:12.5px;line-height:1.65;color:var(--muted)}
.modal-close{
  margin-top:1.5rem;width:100%;padding:13px;border-radius:12px;
  border:1px solid var(--border);background:var(--bg);color:var(--text);
  font-family:'Heebo',sans-serif;font-size:15px;font-weight:700;cursor:pointer;
  transition:background .15s;
}
.modal-close:hover{background:var(--soft)}
.footer{text-align:center;padding:1.2rem;font-size:11px;color:#b9b8b1;letter-spacing:.04em}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:520px){
  .vtl-card{flex-direction:column;align-items:flex-start}
  .tl-label{font-size:9px;max-width:56px}
}
</style>
</head>

        desc:`מופע מסכם לכלל הסגל והמפקדים המציג את תמונת המחזור כולה — עמידה ביעדים, הישגי החניכים והסגל, לקחים מרכזיים והמלצות למחזור הבא. מהווה סגירת מעגל רשמית של ההכשרה והזנק לתכנון המחזור הבא.`
      }
    ]
  }
];

// ─── STATE ────────────────────────────────────────────────────────────
const totalWeeks=13, prepWeeks=3;
let current=0;

function resolveWeeks(t){return typeof t.when==='function'?t.when(totalWeeks,prepWeeks):t.when;}

// ─── COVER / NAV ──────────────────────────────────────────────────────
function enterApp(){
  document.body.classList.add('entered');
  document.getElementById('app').style.display='block';
  setTimeout(()=>{document.getElementById('cover').style.display='none';go(current);},400);
}
function goHome(){
  document.body.classList.remove('entered');
  const c=document.getElementById('cover');
  c.style.display='flex';
  requestAnimationFrame(()=>{document.getElementById('app').style.display='none';});
}

// ─── TIMELINE ─────────────────────────────────────────────────────────
function renderTimeline(){
  const strip=document.getElementById('tl-strip');
  const fill=document.getElementById('tl-fill');
  strip.innerHTML='';
  strip.appendChild(fill);
  phases.forEach((p,i)=>{
    const el=document.createElement('div');
    el.className='tl-phase'+(i===current?' active':'')+(i<current?' done':'');
    el.style.setProperty('--phase-color',p.color);
    el.innerHTML=`<div class="tl-node">${i<current?'✓':p.icon}</div><div class="tl-label">${p.title}</div>`;
    el.onclick=()=>go(i);
    strip.appendChild(el);
  });
  const lineWidth=strip.clientWidth-40;
  const pct=current/(phases.length-1);
  fill.style.width=(lineWidth*pct)+'px';
  fill.style.setProperty('--fill-start',phases[0].color);
  fill.style.setProperty('--fill-end',phases[current].color);
}

// ─── CONTENT ──────────────────────────────────────────────────────────
function renderContent(){
  const p=phases[current];
  const tasksHtml=p.tasks.map((t,ti)=>{
    const weeks=resolveWeeks(t);
    const weekStr=weeks.length>1?`עיתוי: ${weeks.join(' · ')}`:`עיתוי: ${weeks[0]}`;
    const subFlag=t.subtopics&&t.subtopics.length?`<div class="vtl-sub-flag">כולל ${t.subtopics.length} תתי נושאים</div>`:'';
    return `<div class="vtl-item" onclick="openModal(${current},${ti})">
      <div class="vtl-dot" style="--dot-color:${t.dotColor}"></div>
      <div class="vtl-card" style="--dot-color:${t.dotColor}">
        <div class="vtl-left">
          <div class="vtl-name">${t.name}</div>
          <div class="vtl-week">📅 ${weekStr}</div>
          ${subFlag}
        </div>
        <span class="badge ${t.badge}">${t.badgeText}</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML=`
    <div class="phase-hero">
      <div class="phase-icon-box" style="background:${p.bgLight}">${p.icon}</div>
      <div>
        <div class="phase-title" style="color:${p.color}">${p.title}</div>
        <div class="phase-desc">${p.desc}</div>
      </div>
    </div>
    <div class="tap-hint">לחץ על משימה לפרטים נוספים ↓</div>
    <div class="vtl" style="--spine-top:${p.color};--spine-bottom:${p.bgLight}">${tasksHtml}</div>
  `;

  const nav=document.getElementById('nav');
  nav.innerHTML='';
  const prev=document.createElement('div');
  if(current>0){
    const b=document.createElement('button');
    b.className='nav-btn';
    b.textContent='→ '+phases[current-1].title;
    b.onclick=()=>go(current-1);
    prev.appendChild(b);
  }
  nav.appendChild(prev);
  const counter=document.createElement('span');
  counter.className='step-counter';
  counter.textContent=`שלב ${current+1} מתוך ${phases.length}`;
  nav.appendChild(counter);
  const next=document.createElement('div');
  if(current<phases.length-1){
    const b=document.createElement('button');
    b.className='nav-btn primary';
    b.style.background=phases[current+1].color;
    b.textContent=phases[current+1].title+' ←';
    b.onclick=()=>go(current+1);
    next.appendChild(b);
  }
  nav.appendChild(next);
}

function go(idx){
  current=idx;
  renderTimeline();
  renderContent();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ─── MODAL ────────────────────────────────────────────────────────────
function openModal(phaseIdx,taskIdx){
  const p=phases[phaseIdx];
  const t=p.tasks[taskIdx];
  const weeks=resolveWeeks(t);
  const weeksHtml=weeks.map(w=>`<span class="week-chip" style="--chip-bg:${t.chipBg};--chip-color:${t.chipColor}">${w}</span>`).join('');
  const noteHtml=t.whenNote?`<div class="when-note">${t.whenNote}</div>`:'';
  const subHtml=t.subtopics&&t.subtopics.length?`
    <div class="modal-section">
      <div class="modal-section-title">תתי נושאים</div>
      <div class="subtopics">
        ${t.subtopics.map(s=>`<div class="subtopic" style="--sub-color:${p.color}"><div class="subtopic-name">${s.name}</div><div class="subtopic-desc">${s.desc}</div></div>`).join('')}
      </div>
    </div>`:'';
  const sourceHtml=t.source?`
    <div class="modal-section" style="margin-top:.5rem">
      <div class="modal-section-title">מקור</div>
      <div class="modal-body" style="font-size:13px;color:var(--muted)">${t.source}</div>
    </div>`:'';
  document.getElementById('modal-content').innerHTML=`
    <div class="modal-header">
      <div class="modal-icon" style="background:${t.chipBg}">${t.icon}</div>
      <div>
        <div class="modal-title">${t.name}</div>
        <div class="modal-freq"><span class="badge ${t.badge}" style="font-size:11px">${t.badgeText}</span></div>
      </div>
    </div>
    <div class="modal-divider"></div>
    <div class="modal-section">
      <div class="modal-section-title">מה זה?</div>
      <div class="modal-body">${t.desc}</div>
    </div>
    ${subHtml}
    <div class="modal-section">
      <div class="modal-section-title">מתי לבצע?</div>
      <div class="modal-weeks">${weeksHtml}</div>
      ${noteHtml}
    </div>
    ${sourceHtml}
  `;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(e){
  if(!e||e.target===document.getElementById('modal-overlay')){
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

go(0);
window.addEventListener('resize',()=>{if(document.getElementById('app').style.display!=='none')renderTimeline()});
</script>
</body>
</html>
